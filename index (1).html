    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

x; padding:46px 44px; min-height:440px; display:flex; flex-direction:column; position:relative; overflow:hidden;\">\n      <p style=\"font-size:13px; font-weight:600; color:#2997ff; letter-spacing:0.3px; text-transform:uppercase;\">Last-minute? No problem<\u002Fp>\n      <h3 style=\"font-size:36px; font-weight:700; letter-spacing:-1px; margin-top:8px; line-height:1.1; color:#f5f5f7;\">Same-day printing,<br>delivered to your door.<\u002Fh3>\n      <p style=\"font-size:18px; color:#a1a1a6; margin-top:12px; line-height:1.45; max-width:380px;\">Files received in the morning are shipped the same afternoon. Same-day delivery in Rome.<\u002Fp>\n      <div style=\"margin-top:auto; padding-top:28px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:13px; color:#6e6e73;\">\n        <div style=\"display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.12); padding:10px 0;\"><span>09:00 — files received<\u002Fspan><span style=\"color:#2997ff;\">✓<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.12); padding:10px 0;\"><span>11:40 — printed &amp; finished<\u002Fspan><span style=\"color:#2997ff;\">✓<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.12); padding:10px 0;\"><span>15:00 — delivered to venue<\u002Fspan><span style=\"color:#2997ff;\">✓<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:12px; font-weight:700; color:#fff; border-top:1px solid rgba(255,255,255,0.12); padding-top:10px; font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,sans-serif;\">For Milan, Florence, Bologna and the rest of Italy, add one working day.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SERVICE TIERS -->\n  <section id=\"tiers\" style=\"max-width:1024px; margin:104px auto 0; padding:0 22px;\">\n    <div style=\"text-align:center; max-width:720px; margin:0 auto;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">Two service tiers<\u002Fp>\n      <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">Know exactly when it arrives.<\u002Fh2>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:18px;\">This is the distinction that determines whether your event succeeds — and the part most shops keep vague.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ipc-tiles\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:46px;\">\n      <div class=\"ipc-tile\" style=\"background:#1d1d1f; color:#f5f5f7; border-radius:26px; padding:46px 44px; display:flex; flex-direction:column;\">\n        <p style=\"font-size:13px; font-weight:600; color:#2997ff; letter-spacing:0.3px; text-transform:uppercase;\">Tier 1 — Rome<\u002Fp>\n        <h3 style=\"font-size:32px; font-weight:700; letter-spacing:-1px; margin-top:8px; line-height:1.12; color:#f5f5f7;\">True same-day service.<\u002Fh3>\n        <p style=\"font-size:17px; color:#a1a1a6; margin-top:12px; line-height:1.5;\">Files received by <strong style=\"color:#fff;\">9:00<\u002Fstrong>, printed and delivered to your venue or hotel in Rome by <strong style=\"color:#fff;\">15:00<\u002Fstrong> — via UPS or 1-hour courier within Rome. This tier covers <strong style=\"color:#fff;\">flyers and roll-up banners<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ipc-tile\" style=\"background:#f5f5f7; border-radius:26px; padding:46px 44px; display:flex; flex-direction:column;\">\n        <p style=\"font-size:13px; font-weight:600; color:#0071e3; letter-spacing:0.3px; text-transform:uppercase;\">Tier 2 — Milan, Florence, Bologna &amp; the rest of Italy<\u002Fp>\n        <h3 style=\"font-size:32px; font-weight:700; letter-spacing:-1px; margin-top:8px; line-height:1.12;\">Reliable, but planned.<\u002Fh3>\n        <p style=\"font-size:17px; color:#6e6e73; margin-top:12px; line-height:1.5;\">Delivery by UPS — add <strong style=\"color:#1d1d1f;\">one working day<\u002Fstrong>. It arrives during the day and can't be scheduled to a specific hour. If your event is in Bologna, contact us <strong style=\"color:#1d1d1f;\">two days before<\u002Fstrong> — not the night before.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HONEST PRICING -->\n  <section id=\"pricing\" style=\"max-width:720px; margin:104px auto 0; padding:0 22px;\">\n    <div style=\"text-align:center;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">Honest pricing<\u002Fp>\n      <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">What printing honestly costs in Italy.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"font-size:19px; line-height:1.6; color:#1d1d1f; margin-top:36px;\">\n      <p>Foreigners fear being overcharged in a country where they don't speak the language. The fear points the wrong way. Standard-timing printing in Italy is generally <em>cheaper<\u002Fem> than in the Netherlands, and Northern European prices climb by the day. The real risk in Italy isn't price. It's timing — which is exactly what we solve.<\u002Fp>\n      <p style=\"margin-top:20px;\">Our pricing philosophy is Dutch: a quote is a quote. If we make a mistake in the quote, we absorb it. The only exception is when the mistake is in <em>your<\u002Fem> favor. A client once paid for A4 prints when the job was actually A5. We refunded the difference before they noticed anything was wrong.<\u002Fp>\n      <p style=\"margin-top:20px;\">Rush work costs more, and we say so openly. Urgent printing with 1-hour courier delivery costs real money to operate, and honest shops charge for it instead of pretending urgency is free.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DELIVERY ACROSS ITALY -->\n  <section id=\"delivery\" style=\"max-width:1024px; margin:104px auto 0; padding:0 22px;\">\n    <div style=\"text-align:center; max-width:720px; margin:0 auto;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">We come to you<\u002Fp>\n      <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">Printing delivery across Italy.<\u002Fh2>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:18px;\">Wherever your event takes you in Italy, we've got your printing covered. Send us your files, get a quote within 2 hours, and receive your printed materials directly at your hotel, venue, or conference center — no stress, no logistics headaches.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ipc-cities\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:46px;\">\n      <sc-for list=\"{{ cities2 }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <sc-if value=\"{{ c.url }}\" hint-placeholder-val=\"{{ true }}\">\n          <a href=\"{{ c.url }}\" style=\"display:block; background:#f5f5f7; border-radius:22px; overflow:hidden; text-decoration:none; color:inherit;\" style-hover=\"display:block; background:#ececef; border-radius:22px; overflow:hidden; text-decoration:none; color:inherit;\">\n            <sc-if value=\"{{ c.img }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"aspect-ratio:16/7; overflow:hidden;\"><img src=\"{{ c.img }}\" alt=\"{{ c.name }}\" width=\"500\" height=\"219\" loading=\"lazy\" decoding=\"async\" style=\"width:100%; height:100%; object-fit:cover; display:block;\"><\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"padding:34px 32px;\">\n              <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:24px; font-weight:600; letter-spacing:-0.5px; color:#0071e3;\">{{ c.name }}<span style=\"font-size:19px;\">→<\u002Fspan><\u002Fspan>\n              <p style=\"font-size:16px; color:#6e6e73; line-height:1.5; margin-top:10px;\">{{ c.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ c.plainName }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f5f5f7; border-radius:22px; padding:34px 32px;\">\n            <h3 style=\"font-size:24px; font-weight:600; letter-spacing:-0.5px;\">{{ c.name }}<\u002Fh3>\n            <p style=\"font-size:16px; color:#6e6e73; line-height:1.5; margin-top:10px;\">{{ c.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PRODUCTS -->\n  <section id=\"products\" style=\"max-width:1024px; margin:96px auto 0; padding:0 22px; text-align:center;\">\n    <h2 style=\"font-size:52px; font-weight:700; letter-spacing:-1.6px;\">Everything an exhibitor needs.<\u002Fh2>\n    <p style=\"font-size:22px; color:#6e6e73; margin-top:10px; letter-spacing:-0.3px;\">One print partner for the whole stand.<\u002Fp>\n    <div class=\"ipc-products\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:42px;\">\n      <div style=\"background:#f5f5f7; border-radius:22px; overflow:hidden; text-align:left; grid-row:span 2; display:flex; flex-direction:column;\">\n        <div style=\"flex:1; min-height:0; overflow:hidden; background:#fff; padding:10px; border:1px solid #000; border-radius:22px 22px 0 0;\">\n          <video ref=\"{{ magazinesRef }}\" data-src=\"media/magazines-printing.mp4\" preload=\"none\" sc-camel-auto-play=\"{{ true }}\" muted=\"{{ true }}\" sc-camel-default-muted=\"{{ true }}\" loop=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" style=\"display:block; width:100%; height:100%; object-fit:contain;\">\n          <\u002Fvideo>\n        <\u002Fdiv>\n        <div style=\"padding:22px 24px 26px;\">\n          <h4 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px;\">Magazines<\u002Fh4>\n          <p style=\"font-size:15px; color:#6e6e73; margin-top:5px; line-height:1.4;\">Perfect-bound or stapled, printed and delivered to your stand.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <div style=\"background:#f5f5f7; border-radius:22px; overflow:hidden; text-align:left;\">\n          <sc-if value=\"{{ p.img }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"aspect-ratio:4/3; overflow:hidden;\">{{ p.imgEl }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.noImg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"aspect-ratio:4/3; background:repeating-linear-gradient(135deg,#eaeaec,#eaeaec 9px,#e2e2e4 9px,#e2e2e4 18px); display:flex; align-items:center; justify-content:center;\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; color:#86868b; background:rgba(255,255,255,0.82); padding:4px 9px; border-radius:5px;\">{{ p.shot }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"padding:22px 24px 26px;\">\n            <h4 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px;\">{{ p.name }}<\u002Fh4>\n            <p style=\"font-size:15px; color:#6e6e73; margin-top:5px; line-height:1.4;\">{{ p.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW IT WORKS -->\n  <section id=\"how\" style=\"background:#f5f5f7; margin-top:96px; padding:90px 22px;\">\n    <div style=\"max-width:1024px; margin:0 auto; text-align:center;\">\n      <h2 style=\"font-size:52px; font-weight:700; letter-spacing:-1.6px;\">Three steps. Zero stress.<\u002Fh2>\n      <div class=\"ipc-steps\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:34px; margin-top:54px; text-align:left;\">\n        <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div>\n            <div style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">{{ st.n }}<\u002Fdiv>\n            <div style=\"height:1px; background:rgba(0,0,0,0.12); margin:14px 0 20px;\"><\u002Fdiv>\n            <h4 style=\"font-size:26px; font-weight:600; letter-spacing:-0.6px; line-height:1.15;\">{{ st.title }}<\u002Fh4>\n            <p style=\"font-size:17px; color:#6e6e73; margin-top:10px; line-height:1.45;\">{{ st.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHY US / TESTIMONIAL -->\n  <section id=\"why\" style=\"max-width:900px; margin:0 auto; padding:110px 22px; text-align:center;\">\n    <p style=\"font-size:15px; font-weight:600; color:#0071e3; letter-spacing:0.3px; text-transform:uppercase;\">Trusted by 100+ international clients a year<\u002Fp>\n    <blockquote style=\"font-size:40px; font-weight:600; letter-spacing:-1.2px; line-height:1.22; margin-top:22px;\">“It costs a fraction of what I'd pay back home, and it was delivered straight to my hotel. I can't thank you enough.”<\u002Fblockquote>\n    <p style=\"font-size:18px; color:#86868b; margin-top:24px;\">Giuly H. — Conference, Rome<\u002Fp>\n    <div style=\"display:flex; gap:34px; justify-content:center; flex-wrap:wrap; margin-top:48px;\">\n      <span style=\"font-size:16px; color:#6e6e73;\">Dutch precision<\u002Fspan>\n      <span style=\"font-size:16px; color:#d2d2d7;\">·<\u002Fspan>\n      <span style=\"font-size:16px; color:#6e6e73;\">Italian print quality<\u002Fspan>\n      <span style=\"font-size:16px; color:#d2d2d7;\">·<\u002Fspan>\n      <span style=\"font-size:16px; color:#6e6e73;\">35+ years in the trade<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CLIENT LOGO CAROUSEL (self-contained widget, mounted in JS) -->\n  <section ref=\"{{ clientsRef }}\"><\u002Fsection>\n\n  <!-- QUOTE CTA + FORM -->\n  <section id=\"quote\" style=\"background:#1d1d1f; color:#f5f5f7; padding:110px 22px;\">\n    <div style=\"max-width:680px; margin:0 auto; text-align:center;\">\n      <h2 style=\"font-size:clamp(38px,5vw,60px); font-weight:700; letter-spacing:-2px; line-height:1.05;\">Get prices in two hours.<\u002Fh2>\n      <p style=\"font-size:21px; color:#a1a1a6; margin-top:18px; max-width:560px; margin-left:auto; margin-right:auto; letter-spacing:-0.3px;\">Tell us about your event and what you need. We reply Mon–Fri 8–12/15–18 · Sat 8-12 (CET).<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:680px; margin:46px auto 0; background:#fff; color:#1d1d1f; border-radius:28px; padding:60px 44px; text-align:center;\">\n        <div style=\"width:56px; height:56px; border-radius:50%; background:#e8f8ec; display:flex; align-items:center; justify-content:center; margin:0 auto;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#1a9e46\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"font-size:26px; font-weight:700; letter-spacing:-0.6px; margin-top:22px;\">Request sent.<\u002Fh3>\n        <p style=\"font-size:17px; color:#6e6e73; margin-top:10px; line-height:1.5;\">Thanks — we'll reply Mon–Fri 8–12/15–18 · Sat 8-12 (CET), usually within two hours.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <iframe name=\"ipc-hidden-frame\" ref=\"{{ hiddenFrameRef }}\" style=\"display:none\" title=\"form submission target\"><\u002Fiframe>\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n    <form sc-camel-on-submit=\"{{ onSubmit }}\" action=\"https://formsubmit.co/info@italianprintingcompany.com\" method=\"POST\" target=\"ipc-hidden-frame\" style=\"max-width:680px; margin:46px auto 0; background:#fff; color:#1d1d1f; border-radius:28px; padding:44px; text-align:left;\">\n      <input type=\"hidden\" name=\"_subject\" value=\"{{ subjectLine }}\">\n      <input type=\"hidden\" name=\"_captcha\" value=\"false\">\n      <input type=\"hidden\" name=\"_template\" value=\"table\">\n      <input type=\"hidden\" name=\"_replyto\" value=\"{{ email }}\">\n      <input type=\"hidden\" name=\"Material\" value=\"{{ materialValue }}\">\n      <!-- Event city -->\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px;\">The event is in<\u002Flabel>\n      <sc-raw-select name=\"Event city\" value=\"{{ city }}\" sc-camel-on-change=\"{{ onCity }}\" style=\"width:100%; margin-top:10px; font-size:17px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; appearance:none; -webkit-appearance:none; outline:none;\">\n        <option value=\"Rome\">Rome<\u002Foption>\n        <option value=\"Milan\">Milan<\u002Foption>\n        <option value=\"Florence\">Florence<\u002Foption>\n        <option value=\"Bologna\">Bologna<\u002Foption>\n        <option value=\"Venice\">Venice<\u002Foption>\n        <option value=\"Other\">Other<\u002Foption>\n      <\u002Fsc-raw-select>\n\n      <!-- Material -->\n      <div style=\"font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">What do you need us to print?<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;\">\n        <sc-for list=\"{{ materials }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ m.onPick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isOther }}\" hint-placeholder-val=\"{{ false }}\">\n        <input value=\"{{ otherMaterial }}\" sc-camel-on-change=\"{{ onOther }}\" placeholder=\"Tell us what you need\" style=\"width:100%; margin-top:12px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:13px 16px; outline:none;\">\n      <\u002Fsc-if>\n\n      <!-- Other info -->\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">Other information<\u002Flabel>\n      <textarea name=\"Other information\" value=\"{{ info }}\" sc-camel-on-change=\"{{ onInfo }}\" rows=\"4\" placeholder=\"Quantities, sizes, finishes, file details…\" style=\"width:100%; margin-top:10px; font-size:16px; font-family:inherit; line-height:1.45; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; resize:vertical; outline:none;\"><\u002Ftextarea>\n\n      <!-- Deadline -->\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">When is your deadline?<\u002Flabel>\n      <input name=\"Deadline\" value=\"{{ deadline }}\" sc-camel-on-change=\"{{ onDeadline }}\" placeholder=\"e.g. Thursday morning, before the fair opens\" style=\"width:100%; margin-top:10px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; outline:none;\">\n\n      <!-- Email -->\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">Your email address for our reply <span style=\"color:#0071e3;\">*<\u002Fspan><\u002Flabel>\n      <input type=\"email\" name=\"email\" required=\"\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@company.com\" style=\"width:100%; margin-top:10px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; outline:none;\">\n\n      <sc-if value=\"{{ sendError }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-size:14px; color:#d70015; margin-top:22px; te ;\">Accept all<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ declineCookies }}\" style=\"flex:1; min-width:130px; background:#f5f5f7; color:#1d1d1f; border:1px solid #e2e2e4; font-family:inherit; font-size:15px; font-weight:500; padding:11px 20px; border-radius:980px; cursor:pointer;\">Essentials only<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:900}}\">\nconst RES = (id, url) => (window.__resources && window.__resources[id]) || url;\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.landscapeRef = React.createRef();\n    this.magazinesRef = React.createRef();\n    this.portraitRef = React.createRef();\n    this.clientsRef = React.createRef();\n    this.hiddenFrameRef = React.createRef();\n    this._formSubmitted = false;\n    this._setActive = this._setActive.bind(this);\n  }\n  _setActive(isPortrait) {\n    const show = isPortrait ? this.portraitRef.current : this.landscapeRef.current;\n    const hide = isPortrait ? this.landscapeRef.current : this.portraitRef.current;\n    if (!show || !hide) return;\n    hide.style.display = \"none\";\n    try { hide.pause(); } catch (e) {}\n    show.style.display = \"block\";\n    const start = () => {\n      if (!show.getAttribute(\"src\")) {\n        show.setAttribute(\"src\", show.dataset.src);\n        show.load();\n      }\n      const p = show.play();\n      if (p && p.catch) p.catch(() => {});\n    };\n    // paint the poster first; pull the video in only once the page is idle\n    if (this._heroReady) start();\n    else if (window.requestIdleCallback) requestIdleCallback(start, { timeout: 2500 });\n    else setTimeout(start, 1200);\n    this._heroReady = true;\n  }\n  componentDidMount() {\n    [this.landscapeRef.current, this.portraitRef.current].forEach((v) => {\n      if (!v) return;\n      v.loop = true;\n      v.muted = true;\n      v.addEventListener(\"ended\", () => { v.currentTime = 0; v.play().catch(() => {}); });\n    });\n    this.initLazyVideo(this.magazinesRef.current);\n    this.initEmbedResize();\n    if (window.requestIdleCallback) requestIdleCallback(() => this.initClients(), { timeout: 2000 });\n    else setTimeout(() => this.initClients(), 200);\n    if (this.hiddenFrameRef.current) {\n      this.hiddenFrameRef.current.addEventListener(\"load\", () => this._onHiddenFrameLoad());\n    }\n    this._mql = window.matchMedia(\"(orientation: portrait)\");\n    this._setActive(this._mql.matches);\n    this._onChange = (e) => this._setActive(e.matches);\n    if (this._mql.addEventListener) this._mql.addEventListener(\"change\", this._onChange);\n    else if (this._mql.addListener) this._mql.addListener(this._onChange);\n    this.initCookieConsent();\n  }\n  initLazyVideo(v) {\n    if (!v || !v.dataset.src) return;\n    v.loop = true; v.muted = true;\n    const load = () => {\n      if (v.getAttribute(\"src\")) return;\n      v.setAttribute(\"src\", v.dataset.src);\n      v.load();\n      v.play().catch(() => {});\n    };\n    if (!(\"IntersectionObserver\" in window)) return load();\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => { if (e.isIntersecting) { load(); io.disconnect(); } });\n    }, { rootMargin: \"300px\" });\n    io.observe(v);\n  }\n  initCookieConsent() {\n    let decision = null;\n    try { decision = localStorage.getItem(\"ipc_cookie_consent\"); } catch (e) {}\n    if (decision === \"granted\" && window.gtag) {\n      window.gtag(\"consent\", \"update\", { analytics_storage: \"granted\", ad_storage: \"granted\" });\n    }\n    this.setState({ cookieReady: true, cookieDecided: !!decision });\n  }\n  acceptCookies() {\n    try { localStorage.setItem(\"ipc_cookie_consent\", \"granted\"); } catch (e) {}\n    if (window.gtag) window.gtag(\"consent\", \"update\", { analytics_storage: \"granted\", ad_storage: \"granted\" });\n    this.setState({ cookieDecided: true });\n  }\n  declineCookies() {\n    try { localStorage.setItem(\"ipc_cookie_consent\", \"denied\"); } catch (e) {}\n    this.setState({ cookieDecided: true });\n  }\n  _onHiddenFrameLoad() {\n    if (!this._formSubmitted) return; // ignore the iframe's initial blank load\n    clearTimeout(this._sendTimeout);\n    this._formSubmitted = false;\n    this.setState({ sending: false, sent: true });\n  }\n  initEmbedResize() {\n    // When embedded in an iframe (e.g. inside WordPress), report our height\n    // to the parent so the iframe can size itself with no inner scrollbar.\n    if (window.parent === window) return;\n    const post = () => {\n      const h = Math.max(\n        document.body.scrollHeight,\n        document.documentElement.scrollHeight\n      );\n      window.parent.postMessage({ ipcEmbedHeight: h }, \"*\");\n    };\n    this._embedPost = post;\n    if (window.ResizeObserver) {\n      this._embedRO = new ResizeObserver(post);\n      this._embedRO.observe(document.body);\n    }\n    window.addEventListener(\"load\", post);\n    window.addEventListener(\"resize\", post);\n    setTimeout(post, 300);\n    setTimeout(post, 1200);\n  }\n  initClients() {\n    const root = this.clientsRef.current;\n    if (!root || root.dataset.ready) return;\n    root.dataset.ready = \"1\";\n\n    if (!document.getElementById(\"ipc-clients-style\")) {\n      const st = document.createElement(\"style\");\n      st.id = \"ipc-clients-style\";\n      st.textContent = `\n        .ipc-clients{--ink:#0e0d0c;--paper:#f3eee3;--cyan:#00aeef;--magenta:#ec008c;--yellow:#c9a227;--slate:#8a8580;--line:rgba(14,13,12,0.18);--transition-speed:700ms;position:relative;width:100%;background:var(--paper);font-family:'Inter',sans-serif;padding:80px 28px 88px;overflow:hidden;box-sizing:border-box;}\n        .ipc-clients *{box-sizing:border-box;}\n        .ipc-clients .crop{position:absolute;width:2
