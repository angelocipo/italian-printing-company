2vw,22px); color:#6e6e73; line-height:1.45; max-width:720px; margin:16px auto 0;\">At <a href=\"index.html\" style=\"color:#0071e3; text-decoration:none;\">Italian Printing Company<\u002Fa>, we believe affordable printing starts with good planning. When you give us approximately one week to prepare and produce your order, we can organize production efficiently, avoid unnecessary rush costs, and deliver professional printed materials at excellent prices.<\u002Fp>\n    <div style=\"display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:34px;\">\n      <a href=\"#quote\" style=\"background:#0071e3; color:#fff; text-decoration:none; font-size:17px; font-weight:500; padding:12px 26px; border-radius:980px;\">Get a competitive quote<\u002Fa>\n      <a href=\"#planning\" style=\"color:#0071e3; text-decoration:none; font-size:17px; font-weight:500; padding:12px 26px; border-radius:980px; border:1px solid #0071e3;\">Why one week saves money<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FULL LOGO -->\n  <div style=\"display:flex; justify-content:center; padding:64px 22px 0;\">\n    <img data-src=\"img/ipc-logo-full.webp\" alt=\"IPC Italian Printing Company\" width=\"591\" height=\"311\" loading=\"lazy\" decoding=\"async\" style=\"width:min(300px,70vw); height:auto; display:block;\">\n  <\u002Fdiv>\n\n  <!-- STATEMENT -->\n  <section class=\"ipc-tiles\" style=\"max-width:1024px; margin:56px auto 0; padding:0 22px; display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n    <div class=\"ipc-tile\" style=\"background:#1d1d1f; color:#f5f5f7; border-radius:26px; padding:46px 44px; display:flex; flex-direction:column; justify-content:center;\">\n      <p style=\"font-size:13px; font-weight:600; color:#2997ff; letter-spacing:0.3px; text-transform:uppercase;\">Our view<\u002Fp>\n      <h3 style=\"font-size:34px; font-weight:700; letter-spacing:-1px; margin-top:8px; line-height:1.12; color:#f5f5f7;\">Cheap does not mean low quality. <span style=\"color:#2997ff;\">It means paying for printing intelligently.<\u002Fspan><\u002Fh3>\n    <\u002Fdiv>\n    <div class=\"ipc-tile\" style=\"background:#f5f5f7; border-radius:26px; padding:46px 44px; display:flex; flex-direction:column; justify-content:center;\">\n      <p style=\"font-size:13px; font-weight:600; color:#0071e3; letter-spacing:0.3px; text-transform:uppercase;\">What we print<\u002Fp>\n      <p style=\"font-size:19px; color:#1d1d1f; margin-top:12px; line-height:1.5;\">Whether you need business cards, flyers, brochures, posters, roll-up banners, catalogues, or printed materials for a trade show, we help you get the right result for your budget.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 01 PLANNING -->\n  <section id=\"planning\" style=\"max-width:1024px; margin:104px auto 0; padding:0 22px; scroll-margin-top:60px;\">\n    <div style=\"text-align:center; max-width:720px; margin:0 auto;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">01 · Planning<\u002Fp>\n      <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">Why Planning One Week Ahead Saves Money<\u002Fh2>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:18px;\">Urgent printing can be expensive. Tight deadlines limit production options, create logistical pressure, and may require express services or special arrangements.<\u002Fp>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:12px;\">When you order in advance, we have more flexibility to organize your job efficiently.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ipc-grid3\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:46px;\">\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:30px 28px;\">\n        <div style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">01<\u002Fdiv>\n        <h4 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px; margin-top:12px;\">Better production planning<\u002Fh4>\n        <p style=\"font-size:15px; color:#6e6e73; margin-top:6px; line-height:1.45;\">More time to organize printing without unnecessary urgency.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:30px 28px;\">\n        <div style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">02<\u002Fdiv>\n        <h4 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px; margin-top:12px;\">Competitive pricing<\u002Fh4>\n        <p style=\"font-size:15px; color:#6e6e73; margin-top:6px; line-height:1.45;\">Avoid rush charges where possible.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:30px 28px;\">\n        <div style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">03<\u002Fdiv>\n        <h4 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px; margin-top:12px;\">Professional materials<\u002Fh4>\n        <p style=\"font-size:15px; color:#6e6e73; margin-top:6px; line-height:1.45;\">Choose paper weights, finishes, and formats suited to your business.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:30px 28px;\">\n        <div style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">04<\u002Fdiv>\n        <h4 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px; margin-top:12px;\">Fewer mistakes<\u002Fh4>\n        <p style=\"font-size:15px; color:#6e6e73; margin-top:6px; line-height:1.45;\">Time to check your files before production begins.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:30px 28px;\">\n        <div style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">05<\u002Fdiv>\n        <h4 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px; margin-top:12px;\">More reliable delivery<\u002Fh4>\n        <p style=\"font-size:15px; color:#6e6e73; margin-top:6px; line-height:1.45;\">A realistic schedule reduces the risk of missing your event.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#1d1d1f; color:#f5f5f7; border-radius:22px; padding:30px 28px; display:flex; align-items:center;\">\n        <p style=\"font-size:16px; line-height:1.5; color:#a1a1a6;\">Our recommendation is simple: <strong style=\"color:#fff;\">send us your complete order and print-ready files at least one week before you need your materials.<\u002Fstrong> Allow additional time for complex jobs, finishing, shipping, and delivery to your venue.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 MATERIALS -->\n  <section style=\"max-width:720px; margin:104px auto 0; padding:0 22px;\">\n    <div style=\"text-align:center;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">02 · Materials<\u002Fp>\n      <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">Cheap Printing Does Not Mean Cheap Materials<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"font-size:19px; line-height:1.6; color:#1d1d1f; margin-top:36px; display:flex; flex-direction:column; gap:20px;\">\n      <p>Saving money by choosing the wrong paper or compromising on production quality can make your business look less professional.<\u002Fp>\n      <p>A brochure printed on suitable, substantial paper creates a different impression from one printed on stock that feels too thin. The same principle applies to business cards, presentation folders, catalogues, and other materials used to represent your company.<\u002Fp>\n      <p>The objective is not to buy the cheapest possible product. It is to obtain the best balance of price, materials, print quality, and intended use.<\u002Fp>\n      <p style=\"font-weight:600;\">We help you identify where you can save money without undermining the result.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 CONFERENCES -->\n  <section style=\"max-width:1024px; margin:104px auto 0; padding:0 22px;\">\n    <div style=\"text-align:center; max-width:760px; margin:0 auto;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">03 · Conferences &amp; trade shows<\u002Fp>\n      <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">Cheap Printing Services for Conferences and Trade Shows in Italy<\u002Fh2>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:18px;\">Exhibiting at an event in Italy involves enough logistical challenges without worrying about printed materials arriving late.<\u002Fp>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:12px;\">Italian Printing Company supports international businesses, exhibitors, and event organizers who need professional printing in Italy.<\u002Fp>\n      <p style=\"font-size:20px; color:#1d1d1f; font-weight:600; line-height:1.5; margin-top:12px;\">We can help with:<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ipc-grid3\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:36px;\">\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:26px 28px; font-size:18px; font-weight:600; letter-spacing:-0.3px; line-height:1.3;\">Business cards and promotional flyers<\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:26px 28px; font-size:18px; font-weight:600; letter-spacing:-0.3px; line-height:1.3;\">Brochures, catalogues, and booklets<\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:26px 28px; font-size:18px; font-weight:600; letter-spacing:-0.3px; line-height:1.3;\">Posters and presentation materials<\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:26px 28px; font-size:18px; font-weight:600; letter-spacing:-0.3px; line-height:1.3;\">Roll-up banners and exhibition graphics<\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:26px 28px; font-size:18px; font-weight:600; letter-spacing:-0.3px; line-height:1.3;\">Conference signage and event materials<\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:22px; padding:26px 28px; font-size:18px; font-weight:600; letter-spacing:-0.3px; line-height:1.3;\">Custom printed garments and promotional products<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:17px; color:#6e6e73; line-height:1.55; max-width:720px; margin:36px auto 0; text-align:center;\">By arranging production in Italy, you can reduce dependence on international shipping for materials that need to be available at your destination. Delivery arrangements and production times depend on the product, quantity, and location.<\u002Fp>\n    <div style=\"background:#1d1d1f; color:#a1a1a6; border-radius:26px; padding:36px 44px; margin-top:36px; text-align:center;\">\n      <p style=\"font-size:19px; line-height:1.5;\"><strong style=\"color:#fff;\">Attending an event in <a href=\"rome.html\" style=\"color:#2997ff; text-decoration:none;\">Rome<\u002Fa>, <a href=\"milan.html\" style=\"color:#2997ff; text-decoration:none;\">Milan<\u002Fa>, <a href=\"florence.html\" style=\"color:#2997ff; text-decoration:none;\">Florence<\u002Fa>, or <a href=\"index.html#delivery\" style=\"color:#2997ff; text-decoration:none;\">another Italian city<\u002Fa>?<\u002Fstrong> Plan your printing before you travel and avoid paying for last-minute solutions.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 FILES -->\n  <section id=\"files\" style=\"background:#f5f5f7; margin-top:104px; padding:90px 22px;\">\n    <div style=\"max-width:1024px; margin:0 auto;\">\n      <div style=\"text-align:center; max-width:720px; margin:0 auto;\">\n        <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">04 · Print-ready files<\u002Fp>\n        <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">Send Print-Ready Files and Avoid Unnecessary Costs<\u002Fh2>\n        <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:18px;\">One of the most effective ways to keep printing affordable is to prepare your files correctly.<\u002Fp>\n        <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:12px;\">Before production, we check important technical details, including:<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border-radius:22px; margin-top:40px; overflow:hidden;\">\n        <div class=\"ipc-filerow\" style=\"display:grid; grid-template-columns:48px 200px minmax(0,1fr); gap:6px 16px; padding:22px 28px; border-bottom:1px solid rgba(0,0,0,0.08); align-items:baseline;\"><span style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">01<\u002Fspan><span style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px;\">Resolution<\u002Fspan><span style=\"font-size:16px; color:#6e6e73; line-height:1.45;\">Images must have sufficient resolution for the final print size.<\u002Fspan><\u002Fdiv>\n        <div class=\"ipc-filerow\" style=\"display:grid; grid-template-columns:48px 200px minmax(0,1fr); gap:6px 16px; padding:22px 28px; border-bottom:1px solid rgba(0,0,0,0.08); align-items:baseline;\"><span style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">02<\u002Fspan><span style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px;\">Bleed<\u002Fspan><span style=\"font-size:16px; color:#6e6e73; line-height:1.45;\">Artwork must extend beyond the final cutting line where required.<\u002Fspan><\u002Fdiv>\n        <div class=\"ipc-filerow\" style=\"display:grid; grid-template-columns:48px 200px minmax(0,1fr); gap:6px 16px; padding:22px 28px; border-bottom:1px solid rgba(0,0,0,0.08); align-items:baseline;\"><span style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">03<\u002Fspan><span style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px;\">Dimensions<\u002Fspan><span style=\"font-size:16px; color:#6e6e73; line-height:1.45;\">Files must match the agreed final format.<\u002Fspan><\u002Fdiv>\n        <div class=\"ipc-filerow\" style=\"display:grid; grid-template-columns:48px 200px minmax(0,1fr); gap:6px 16px; padding:22px 28px; align-items:baseline;\"><span style=\"font-size:15px; font-weight:700; color:#0071e3; font-family:ui-monospace,'SF Mono',Menlo,monospace;\">04<\u002Fspan><span style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px;\">File readiness<\u002Fspan><span style=\"font-size:16px; color:#6e6e73; line-height:1.45;\">Fonts, images, and artwork must be suitable for production.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:720px; margin:36px auto 0; text-align:center; font-size:17px; color:#6e6e73; line-height:1.55; display:flex; flex-direction:column; gap:12px;\">\n        <p>If a file is unsuitable, we address the problem before printing rather than allowing a preventable mistake to reach production.<\u002Fp>\n        <p>Correct files reduce the risk of reprints, delays, and additional costs. If artwork requires correction or adaptation, any additional work should be agreed upon before production.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 URGENT -->\n  <section style=\"max-width:1024px; margin:104px auto 0; padding:0 22px;\">\n    <div style=\"text-align:center; max-width:760px; margin:0 auto;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">05 · Urgent printing<\u002Fp>\n      <h2 style=\"font-size:clamp(34px,4.2vw,52px); font-weight:700; letter-spacing:-1.6px; margin-top:12px; line-height:1.06;\">Need Printing Urgently? We Can Help, but Plan Ahead When Possible<\u002Fh2>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:18px;\">Sometimes deadlines cannot be avoided. A supplier fails to deliver, international shipments are delayed, or conference materials are lost in transit.<\u002Fp>\n      <p style=\"font-size:20px; color:#6e6e73; line-height:1.5; margin-top:12px;\">We have helped clients in precisely these situations.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ipc-tiles\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:46px;\">\n      <div class=\"ipc-tile\" style=\"background:#1d1d1f; color:#f5f5f7; border-radius:26px; padding:46px 44px;\">\n        <p style=\"font-size:13px; font-weight:600; color:#2997ff; letter-spacing:0.3px; text-transform:uppercase;\">Supplier failed<\u002Fp>\n        <h3 style=\"font-size:42px; font-weight:700; letter-spacing:-1.4px; margin-top:8px; line-height:1.05; color:#f5f5f7;\">2 hours<\u002Fh3>\n        <p style=\"font-size:17px; color:#a1a1a6; margin-top:12px; line-height:1.5;\">In one case, another supplier failed to deliver on time, and we produced the required printing in just two hours.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ipc-tile\" style=\"background:#f5f5f7; border-radius:26px; padding:46px 44px;\">\n        <p style=\"font-size:13px; font-weight:600; color:#0071e3; letter-spacing:0.3px; text-transform:uppercase;\">Lost in customs<\u002Fp>\n        <h3 style=\"font-size:42px; font-weight:700; letter-spacing:-1.4px; margin-top:8px; line-height:1.05;\">Local reprint<\u002Fh3>\n        <p style=\"font-size:17px; color:#6e6e73; margin-top:12px; line-height:1.5;\">In another, printed materials were lost in customs while entering Italy, so we arranged a local reprint in time for the deadline.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:720px; margin:36px auto 0; text-align:center; font-size:19px; line-height:1.55; display:flex; flex-direction:column; gap:12px;\">\n      <p style=\"font-weight:600; color:#d70015;\">These are emergency solutions, not the cheapest way to print.<\u002Fp>\n      <p style=\"color:#6e6e73;\">Our advice is to build in at least one extra day before your event whenever possible. For shipping to another Italian city, allow enough time for production and transport rather than assuming a shipment will arrive at the last minute.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CLOSING STATEMENT -->\n  <section style=\"max-width:900px; margin:0 auto; padding:110px 22px; text-align:center;\">\n    <blockquote style=\"font-size:clamp(28px,3.6vw,40px); font-weight:600; letter-spacing:-1.2px; line-height:1.22;\">Italian Printing Company: professional printing in Italy, competitive prices, and quality that represents your business properly.<\u002Fblockquote>\n    <p style=\"font-size:19px; color:#0071e3; margin-top:24px;\">Plan ahead, print intelligently, and spend your budget where it makes a difference.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 06 QUOTE -->\n  <section id=\"quote\" style=\"background:#1d1d1f; color:#f5f5f7; padding:110px 22px;\">\n    <div style=\"max-width:680px; margin:0 auto; text-align:center;\">\n      <p style=\"font-size:14px; font-weight:600; color:#2997ff; letter-spacing:0.4px; text-transform:uppercase;\">06 · Quote<\u002Fp>\n      <h2 style=\"font-size:clamp(38px,5vw,60px); font-weight:700; letter-spacing:-2px; line-height:1.05; margin-top:12px;\">Get a Competitive Printing Quote in Italy<\u002Fh2>\n      <p style=\"font-size:19px; color:#a1a1a6; margin-top:18px; line-height:1.5;\">If you are searching for a cheap print service in Italy, start with the specifications rather than the lowest advertised price.<\u002Fp>\n      <p style=\"font-size:19px; color:#a1a1a6; margin-top:12px; line-height:1.5;\">Send complete, print-ready files whenever possible. We can then assess the job and provide a quote based on the actual requirements.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:680px; margin:46px auto 0; background:#fff; color:#1d1d1f; border-radius:28px; padding:60px 44px; text-align:center;\">\n        <div style=\"width:56px; height:56px; border-radius:50%; background:#e8f8ec; display:flex; align-items:center; justify-content:center; margin:0 auto;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#1a9e46\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"font-size:26px; font-weight:700; letter-spacing:-0.6px; margin-top:22px;\">Request sent.<\u002Fh3>\n        <p style=\"font-size:17px; color:#6e6e73; margin-top:10px; line-height:1.5;\">Thanks — we'll reply Mon–Fri 8–12/15–18 · Sat 8-12 (CET), usually within two hours.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <iframe name=\"ipc-hidden-frame\" ref=\"{{ hiddenFrameRef }}\" style=\"display:none\" title=\"form submission target\"><\u002Fiframe>\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n    <form sc-camel-on-submit=\"{{ onSubmit }}\" action=\"https://formsubmit.co/info@italianprintingcompany.com\" method=\"POST\" target=\"ipc-hidden-frame\" style=\"max-width:680px; margin:46px auto 0; background:#fff; color:#1d1d1f; border-radius:28px; padding:44px; text-align:left;\">\n      <input type=\"hidden\" name=\"_subject\" value=\"{{ subjectLine }}\">\n      <input type=\"hidden\" name=\"_captcha\" value=\"false\">\n      <input type=\"hidden\" name=\"_template\" value=\"table\">\n      <input type=\"hidden\" name=\"_replyto\" value=\"{{ email }}\">\n      <input type=\"hidden\" name=\"Source page\" value=\"Cheap Print Service Italy\">\n      <div style=\"font-size:17px; font-weight:600; letter-spacing:-0.3px;\">Tell us what you need, including:<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;\">\n        <span style=\"font-size:14px; background:#f5f5f7; border-radius:980px; padding:7px 14px; color:#6e6e73;\">Product and final dimensions<\u002Fspan>\n        <span style=\"font-size:14px; background:#f5f5f7; border-radius:980px; padding:7px 14px; color:#6e6e73;\">Quantity<\u002Fspan>\n        <span style=\"font-size:14px; background:#f5f5f7; border-radius:980px; padding:7px 14px; color:#6e6e73;\">Paper type or material<\u002Fspan>\n        <span style=\"font-size:14px; background:#f5f5f7; border-radius:980px; padding:7px 14px; color:#6e6e73;\">Finishing requirements<\u002Fspan>\n        <span style=\"font-size:14px; background:#f5f5f7; border-radius:980px; padding:7px 14px; color:#6e6e73;\">Delivery address and required date<\u002Fspan>\n      <\u002Fdiv>\n      <textarea name=\"Order details\" value=\"{{ info }}\" sc-camel-on-change=\"{{ onInfo }}\" rows=\"6\" placeholder=\"Business cards, 85×55 mm, 500 pcs, 400g matt, delivered to Fiera Milano by 14 Nov…\" style=\"width:100%; margin-top:16px; font-size:16px; font-family:inherit; line-height:1.45; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; resize:vertical; outline:none;\"><\u002Ftextarea>\n\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">Your email address for our reply <span style=\"color:#0071e3;\">*<\u002Fspan><\u002Flabel>\n      <input type=\"email\" name=\"email\" required=\"\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@company.com\" style=\"width:100%; margin-top:10px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; outline:none;\">\n\n      <sc-if value=\"{{ sendError }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-size:14px; color:#d70015; margin-top:22px; text-align:center;\">Something went wrong sending your request. Please try again, or email us directly.<\u002Fp>\n      <\u002Fsc-if>\n\n      <button type=\"submit\" disabled=\"{{ sending }}\" style=\"{{ submitBtnStyle }}\">{{ submitLabel }}<\u002Fbutton>\n      <p style=\"font-size:13px; color:#86868b; text-align:center; margin-top:14px;\">We'll email you back directly — no need to open your mail app.<\u002Fp>\n    <\u002Fform>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#f5f5f7; color:#86868b; font-size:12px; line-height:1.6; padding:40px 22px; text-align:center;\">\n    <div style=\"max-width:1024px; margin:0 auto;\">\n      <div style=\"border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:22px; display:flex; flex-direction:column-reverse; align-items:center; gap:18px;\">\n        <a href=\"https://www.google.com/preferences/source?q=italian%20printing%20company\" target=\"_blank\" rel=\"noopener\" style=\"display:flex; align-items:center; justify-content:center; gap:9px; background:#fff; border:1px solid rgba(0,0,0,0.14); border-radius:999px; padding:9px 16px; font-size:13px; font-weight:600; color:#1d1d1f; text-decoration:none; line-height:1.25; box-shadow:0 1px 2px rgba(0,0,0,0.05); max-width:100%; text-align:center;\" style-hover=\"border-color:rgba(66,133,244,0.55); color:#0071e3; box-shadow:0 4px 14px rgba(66,133,244,0.22);\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 48 48\" aria-hidden=\"true\" style=\"flex:none;\"><path fill=\"#4285F4\" d=\"M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84a10.13 10.13 0 0 1-4.4 6.65v5.52h7.1c4.16-3.83 6.56-9.47 6.56-16.18z\"><\u002Fpath><path fill=\"#34A853\" d=\"M24 46c5.94 0 10.92-1.97 14.56-5.
