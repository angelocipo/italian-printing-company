<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>Payment test | Italian Printing Company</title>
<link rel="icon" type="image/webp" href="img/favicon.webp">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f5f5f7; font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; color:#1d1d1f; -webkit-font-smoothing:antialiased; }
  a { color:#0071e3; text-decoration:none; }
  a:hover { color:#0059b8; }
</style>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<main style="max-width:560px; margin:0 auto; padding:64px 22px; display:flex; flex-direction:column; gap:24px;">
  <a href="/" style="display:flex;"><img src="img/ipc-logo.webp" alt="Italian Printing Company" style="height:30px; width:auto;"></a>
  <div id="msg" hidden style="background:#fff; border-radius:18px; padding:18px 22px; font-size:16px; line-height:1.45;"></div>
  <div style="background:#fff; border-radius:26px; padding:32px; display:flex; flex-direction:column; gap:18px;">
    <p style="font-size:13px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;">Internal · payment test</p>
    <h1 style="font-size:30px; line-height:1.15; font-weight:700; letter-spacing:-0.6px;">Test product</h1>
    <p style="font-size:16px; line-height:1.5; color:#6e6e73;">Real Stripe or Nexi checkout for € 1,00. No shipping, nothing is printed. Refund it from the Stripe dashboard after checking.</p>
    <div style="display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid #e5e5ea; padding-top:18px;">
      <span style="font-size:17px; font-weight:600;">Total, VAT included</span>
      <span style="font-size:24px; font-weight:700; font-variant-numeric:tabular-nums;">€&nbsp;1,00</span>
    </div>
    <label style="display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:600; color:#6e6e73;">Email for the Stripe receipt (optional)
      <input id="email" type="email" autocomplete="email" style="font:inherit; font-weight:400; color:#1d1d1f; font-size:17px; padding:12px 14px; border:1px solid #d2d2d7; border-radius:12px;">
    </label>
    <button id="pay" type="button" style="font:inherit; font-size:17px; font-weight:600; color:#fff; background:#0071e3; border:0; border-radius:980px; padding:15px 28px; cursor:pointer;">Pay € 1,00 with Stripe</button>
    <button id="paynx" type="button" style="font:inherit; font-size:17px; font-weight:600; color:#0071e3; background:#fff; border:1.5px solid #0071e3; border-radius:980px; padding:14px 28px; cursor:pointer;">Pay € 1,00 with Nexi</button>
  </div>
</main>
<script>(function(){
var q=new URLSearchParams(location.search),m=document.getElementById('msg'),b=document.getElementById('pay'),n=document.getElementById('paynx');
if(q.get('paid')&&q.get('provider')==='nexi'){m.hidden=false;m.textContent='Checking the Nexi payment…';
  fetch('/api/nexi-verify'+location.search).then(function(r){return r.json();}).then(function(d){
    m.textContent=d.ok?'Nexi payment verified (signature OK, esito OK). Reference: '+(q.get('ref')||'')+', transaction '+d.codTrans+', authorization '+d.codAut:'Nexi payment NOT confirmed. esito: '+(d.esito||'?')+', signature valid: '+d.macValid+(d.error?(' — '+d.error):'');
  }).catch(function(){m.textContent='Could not verify the Nexi payment.';});
}else if(q.get('paid')){m.hidden=false;m.textContent='Payment received. Reference: '+(q.get('ref')||'');}
if(q.get('canceled')){m.hidden=false;m.textContent='Payment canceled.';}
function go(btn,prov,label){
  b.disabled=true;n.disabled=true;btn.textContent='Opening checkout…';
  var ref='TEST-'+Date.now().toString(36).toUpperCase();
  var body={paper:'test',ref:ref,email:document.getElementById('email').value,page:'vip-studio-test.html'};if(prov)body.provider=prov;
  fetch('/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json();}).then(function(d){if(d.form){var f=document.createElement('form');f.method='POST';f.action=d.form.action;f.acceptCharset='ISO-8859-1';Object.keys(d.form.fields).forEach(function(k){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=d.form.fields[k];f.appendChild(i);});document.body.appendChild(f);f.submit();}else if(d.url)location.href=d.url;else throw new Error(d.error||'Checkout failed');})
  .catch(function(e){m.hidden=false;m.textContent=e.message;b.disabled=false;n.disabled=false;btn.textContent=label;});
}
b.addEventListener('click',function(){go(b,'','Pay € 1,00 with Stripe');});
n.addEventListener('click',function(){go(n,'nexi','Pay € 1,00 with Nexi');});
})();</script>
</body>
</html>
