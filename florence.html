    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  <footer style=\"background:#f5f5f7; color:#86868b; font-size:12px; line-height:1.6; padding:40px 22px; text-align:center;\">\n    <div style=\"max-width:1024px; margin:0 auto;\">\n      <div style=\"border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:22px;\">\n        <div style=\"font-weight:600; color:#1d1d1f; font-size:14px;\">Italian Printing Company by Printing Italy di Angelo Cipolla. Via Lorenzo Bonincontri 26, 00147 Roma RM · P.IVA 02452700590<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:18px;\">A Dutch-Italian printing company based in Rome, serving international exhibitors across Italy. Overnight printing service available. Concept redesign.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.cityKey = \"Florence\"; /* CITY_KEY */\n    this.clientsRef = React.createRef();\n    this.state = { city: this.cityKey, material: \"Business Cards\", otherMaterial: \"\", info: \"\", deadline: \"\", email: \"\", openFaq: null };\n  }\n  componentDidMount() {\n    this.initEmbedResize();\n    this.initClients();\n  }\n  initEmbedResize() {\n    if (window.parent === window) return;\n    const post = () => {\n      const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);\n      window.parent.postMessage({ ipcEmbedHeight: h }, \"*\");\n    };\n    if (window.ResizeObserver) {\n      this._embedRO = new ResizeObserver(post);\n      this._embedRO.observe(document.body);\n    }\n    window.addEventListener(\"load\", post);\n    window.addEventListener(\"resize\", post);\n    setTimeout(post, 300);\n    setTimeout(post, 1200);\n  }\n  initClients() {\n    const root = this.clientsRef.current;\n    if (!root || root.dataset.ready) return;\n    root.dataset.ready = \"1\";\n    if (!document.getElementById(\"ipc-clients-style\")) {\n      const st = document.createElement(\"style\");\n      st.id = \"ipc-clients-style\";\n      st.textContent = `\n        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');\n        .ipc-clients{--ink:#0e0d0c;--paper:#f3eee3;--cyan:#00aeef;--magenta:#ec008c;--yellow:#c9a227;--slate:#8a8580;--line:rgba(14,13,12,0.18);--transition-speed:700ms;position:relative;width:100%;background:var(--paper);font-family:'Inter',sans-serif;padding:80px 28px 88px;overflow:hidden;box-sizing:border-box;margin-top:104px;}\n        .ipc-clients *{box-sizing:border-box;}\n        .ipc-clients .crop{position:absolute;width:22px;height:22px;z-index:5;opacity:.45;pointer-events:none;}\n        .ipc-clients .crop::before,.ipc-clients .crop::after{content:'';position:absolute;background:var(--ink);}\n        .ipc-clients .crop::before{width:100%;height:1px;top:0;left:0;}\n        .ipc-clients .crop::after{width:1px;height:100%;top:0;left:0;}\n        .ipc-clients .crop-tl{top:18px;left:18px;}\n        .ipc-clients .crop-tr{top:18px;right:18px;transform:scaleX(-1);}\n        .ipc-clients .crop-bl{bottom:18px;left:18px;transform:scaleY(-1);}\n        .ipc-clients .crop-br{bottom:18px;right:18px;transform:scale(-1,-1);}\n        .ipc-clients .clients-head{max-width:1080px;margin:0 auto 44px;text-align:center;}\n        .ipc-clients .job-ticket{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);margin-bottom:10px;}\n        .ipc-clients .job-ticket .job-num{color:var(--ink);}\n        .ipc-clients .clients-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95;font-size:clamp(1.8rem,2vw + 1.3rem,2.8rem);color:var(--ink);margin:0 0 14px;}\n        .ipc-clients .ink-bar{display:flex;gap:3px;justify-content:center;}\n        .ipc-clients .ink-bar span{width:26px;height:6px;display:block;}\n        .ipc-clients .ink-bar .c{background:var(--cyan);}\n        .ipc-clients .ink-bar .m{background:var(--magenta);}\n        .ipc-clients .ink-bar .y{background:var(--yellow);}\n        .ipc-clients .ink-bar .k{background:var(--ink);opacity:.85;}\n        .ipc-clients .carousel{position:relative;max-width:1180px;margin:0 auto;}\n        .ipc-clients .logo-pages{position:relative;min-height:210px;}\n        .ipc-clients .logo-page{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px;opacity:0;transition:opacity var(--transition-speed) ease;pointer-events:none;}\n        .ipc-clients .logo-page.active{opacity:1;pointer-events:auto;position:relative;}\n        .ipc-clients .logo-slot{list-style:none;width:220px;display:flex;flex-direction:column;align-items:center;gap:14px;}\n        .ipc-clients .placeholder-mark{width:100%;height:150px;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;background:rgba(14,13,12,0.02);}\n        .ipc-clients .logo-img{max-width:100%;max-height:150px;object-fit:contain;filter:grayscale(1);opacity:.72;transition:filter .2s ease,opacity .2s ease;}\n        .ipc-clients .logo-slot:hover .logo-img{filter:grayscale(0);opacity:1;}\n        .ipc-clients .logo-caption{font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);text-align:center;}\n        .ipc-clients .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease,border-color .2s ease;}\n        .ipc-clients .arrow:hover{background:rgba(14,13,12,0.06);border-color:rgba(14,13,12,0.4);}\n        .ipc-clients .arrow.prev{left:-50px;}\n        .ipc-clients .arrow.next{right:-50px;}\n        .ipc-clients .nav-dots{display:flex;justify-content:center;gap:14px;margin-top:44px;}\n        .ipc-clients .dot{position:relative;width:24px;height:24px;border:none;background:none;cursor:pointer;padding:0;}\n        .ipc-clients .dot-ring{position:absolute;inset:0;}\n        .ipc-clients .dot-ring circle{fill:none;stroke:rgba(14,13,12,0.25);stroke-width:1.5;}\n        .ipc-clients .dot-progress{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:62.8;stroke-dashoffset:62.8;}\n        .ipc-clients .dot.active .dot-progress{stroke:var(--cyan);}\n        .ipc-clients .dot::before,.ipc-clients .dot::after{content:'';position:absolute;background:rgba(14,13,12,0.4);}\n        .ipc-clients .dot::before{width:8px;height:1px;top:50%;left:50%;transform:translate(-50%,-50%);}\n        .ipc-clients .dot::after{width:1px;height:8px;top:50%;left:50%;transform:translate(-50%,-50%);}\n        .ipc-clients .dot.active::before,.ipc-clients .dot.active::after{background:var(--ink);}\n        @media (max-width:900px){.ipc-clients .arrow.prev{left:0;}.ipc-clients .arrow.next{right:0;}.ipc-clients .carousel{padding:0 50px;}}\n        @media (max-width:560px){.ipc-clients{padding:56px 18px 60px;}.ipc-clients .logo-slot{width:44%;}.ipc-clients .arrow{width:34px;height:34px;font-size:1.1rem;}}\n      `;\n      document.head.appendChild(st);\n    }\n    const logos = [\n      [\"Emirates\", \"logo-emirates.png\"],\n      [\"NL\", \"logo-nl.webp\"],\n      [\"Milwaukee\", \"logo-milwaukee.webp\"],\n      [\"Microsoft\", \"logo-microsoft-copia.png\"],\n      [\"IBM\", \"logo-ibm.webp\"],\n      [\"Qatar Airways\", \"logo-qatar.webp\"],\n    ];\n    const base = \"img/\";\n    const slots = logos.map(([name, file]) =>\n      `<li class=\"logo-slot\" data-name=\"${name}\"><div class=\"placeholder-mark\" style=\"border-style:solid;background:transparent;\"><img class=\"logo-img\" src=\"${base}${file}\" alt=\"${name}\" style=\"filter:none;opacity:1;\"><\u002Fdiv><span class=\"logo-caption\">${name}<\u002Fspan><\u002Fli>`\n    ).join(\"\");\n    root.className = \"ipc-clients\";\n    root.setAttribute(\"aria-label\", \"Companies we've worked with\");\n    root.innerHTML = `\n      <div class=\"crop crop-tl\"><\u002Fdiv><div class=\"crop crop-tr\"><\u002Fdiv>\n      <div class=\"crop crop-bl\"><\u002Fdiv><div class=\"crop crop-br\"><\u002Fdiv>\n      <div class=\"clients-head\">\n        <div class=\"job-ticket\">Clients № <span class=\"job-num\">01<\u002Fspan>/02<\u002Fdiv>\n        <h3 class=\"clients-title\">Companies we've worked with<\u002Fh3>\n        <div class=\"ink-bar\"><span class=\"c\"><\u002Fspan><span class=\"m\"><\u002Fspan><span class=\"y\"><\u002Fspan><span class=\"k\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"carousel\">\n        <button class=\"arrow prev\" aria-label=\"Previous logos\">‹<\u002Fbutton>\n        <button class=\"arrow next\" aria-label=\"Next logos\">›<\u002Fbutton>\n        <div class=\"logo-pages\" id=\"ipcLogoPages\"><\u002Fdiv>\n        <div class=\"nav-dots\" id=\"ipcNavDots\" role=\"tablist\"><\u002Fdiv>\n      <\u002Fdiv>\n      <ul id=\"ipcLogoSource\" hidden>${slots}<\u002Ful>\n    `;\n    const source = Array.from(root.querySelector(\"#ipcLogoSource\").children);\n    const pagesWrap = root.querySelector(\"#ipcLogoPages\");\n    const dotsWrap = root.querySelector(\"#ipcNavDots\");\n    const prevBtn = root.querySelector(\".arrow.prev\");\n    const nextBtn = root.querySelector(\".arrow.next\");\n    const SLIDE_DURATION = 5000;\n    const reduceMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    let pages = [], current = 0, timer = null, resizeTO = null;\n    const itemsPerPage = () => {\n      const w = window.innerWidth;\n      if (w < 560) return 2;\n      if (w < 900) return 3;\n      if (w < 1280) return 4;\n      return 5;\n    };\n    const chunk = (arr, size) => { const out = []; for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size)); return out; };\n    const buildDots = (count) => {\n      dotsWrap.innerHTML = \"\";\n      for (let i = 0; i < count; i++) {\n        const btn = document.createElement(\"button\");\n        btn.className = \"dot\";\n        btn.setAttribute(\"role\", \"tab\");\n        btn.setAttribute(\"aria-label\", \"Go to logo page \" + (i + 1));\n        btn.innerHTML = '<svg class=\"dot-ring\" viewBox=\"0 0 26 26\"><circle cx=\"13\" cy=\"13\" r=\"10\"><\u002Fcircle><circle class=\"dot-progress\" cx=\"13\" cy=\"13\" r=\"10\" transform=\"rotate(-90 13 13)\"><\u002Fcircle><\u002Fsvg>';\n        btn.addEventListener(\"click\", () => goTo(i, true));\n        dotsWrap.appendChild(btn);\n      }\n    };\n    const resetRing = (dot) => { const r = dot.querySelector(\".dot-progress\"); r.style.transition = \"none\"; r.style.strokeDashoffset = \"62.8\"; };\n    const runRing = (dot) => {\n      const r = dot.querySelector(\".dot-progress\"); resetRing(dot);\n      if (reduceMotion) return;\n      requestAnimationFrame(() => requestAnimationFrame(() => {\n        r.style.transition = \"stroke-dashoffset \" + SLIDE_DURATION + \"ms linear\";\n        r.style.strokeDashoffset = \"0\";\n      }));\n    };\n    const showPage = (index) => {\n      current = (index + pages.length) % pages.length;\n      pages.forEach((p, i) => p.classList.toggle(\"active\", i === current));\n      const dots = Array.from(dotsWrap.children);\n      dots.forEach((d, i) => { d.classList.toggle(\"active\", i === current); if (i === current) runRing(d); else resetRing(d); });\n      const ticket = root.querySelector(\".job-ticket\");\n      ticket.innerHTML = 'Clients № <span class=\"job-num\">' + String(current + 1).padStart(2, \"0\") + \"<\u002Fspan>/\" + String(pages.length).padStart(2, \"0\");\n    };\n    const goTo = (index, user) => { showPage(index); if (user) restartTimer(); };\n t Italy. Wherever your event is, send us your files and we'll arrange delivery. Italy is our territory.\" },\n    ];\n\n    const FAQS = {\"Rome\":[{\"q\":\"Can you deliver printing to my hotel or exhibition stand in Rome?\",\"a\":\"Yes. We deliver across Rome — to Fiera di Roma, the La Nuvola Convention Centre, Palazzo dei Congressi and hotels from EUR to the city centre — straight to your hotel room, your stand or the venue's front desk. Our base is in the EUR district, so for urgent jobs we can even arrange same-day pickup and drop-off.\"},{\"q\":\"How fast can I get printing done in Rome as a last-minute exhibitor?\",\"a\":\"Send your files in the morning and we can often have the finished pieces ready by the afternoon, delivered the same day within Rome. Message us on WhatsApp and we'll confirm the timing for your specific job in minutes.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Rome do you serve?\",\"a\":\"Regularly Fiera di Roma, the La Nuvola Convention Centre and Palazzo dei Congressi in EUR, plus hotels across Parioli, Trastevere and the historic centre. If your event is somewhere else in Rome, just send us the address.\"},{\"q\":\"Do you only cover Rome, or the rest of Italy too?\",\"a\":\"Rome is our home — we've printed here since 2008 and know the city's delivery routes inside out — but we ship across Italy to Milan, Florence, Bologna, Venice and beyond. Wherever your event is, send your files and we'll arrange delivery.\"}],\"Milan\":[{\"q\":\"Can you deliver printing to my hotel or stand in Milan?\",\"a\":\"Yes. We ship overnight to Milan and deliver to MiCo – Milano Congressi, Fiera Milano in Rho, Allianz MiCo and any hotel in the city — straight to your stand, your room or the venue desk. Order by evening and it's with you by morning.\"},{\"q\":\"How fast can I get printing done in Milan?\",\"a\":\"Order by evening and your printing is delivered the next day across Milan — to your stand, hotel or the venue desk. Message us on WhatsApp and we'll confirm the exact timing for your fair in minutes.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Milan do you serve?\",\"a\":\"MiCo – Milano Congressi, Fiera Milano (Rho), Allianz MiCo and city-centre hotels. If your event is anywhere else in Milan, just give us the address.\"},{\"q\":\"Are you based in Milan, or do you cover the rest of Italy?\",\"a\":\"We ship overnight to Milan but we're based in Rome, where we've printed since 2008. We also cover Florence, Bologna, Venice and the rest of Italy — send your files wherever your event is.\"}],\"Florence\":[{\"q\":\"Can you deliver printing to my hotel or stand in Florence?\",\"a\":\"Yes. We deliver city-wide in Florence — to Fortezza da Basso, the Palazzo dei Congressi and the city's Renaissance congress venues, as well as your hotel or stand. Tell us the address and we handle the rest.\"},{\"q\":\"How fast can I get printing done in Florence?\",\"a\":\"Send us your files and we deliver the next day across Florence — to your hotel, stand or venue. Message us on WhatsApp to confirm the timing for your job.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Florence do you serve?\",\"a\":\"Fortezza da Basso, the Palazzo dei Congressi and Florence's historic congress venues, plus hotels city-wide. Anywhere else in Florence, just send us the address.\"},{\"q\":\"Are you based in Florence, or do you cover the rest of Italy?\",\"a\":\"We deliver throughout Florence but we're Rome-based, printing since 2008, and we also serve Milan, Bologna, Venice and the rest of Italy. Send your files wherever your event is.\"}],\"Bologna\":[{\"q\":\"Can you deliver printing to my hotel or stand in Bologna?\",\"a\":\"Yes. We deliver regularly to BolognaFiere, the Bologna Convention Centre and surrounding hotels — straight to your stand, your room or the venue desk. It's a route we run often for trade fairs and medical congresses.\"},{\"q\":\"How fast can I get printing done in Bologna?\",\"a\":\"Send us your files and we deliver the next day to BolognaFiere or your hotel. Message us on WhatsApp to lock in the timing for your job.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Bologna do you serve?\",\"a\":\"BolognaFiere, the Bologna Convention Centre and the hotels around the fair district. Anywhere else in Bologna, just send us the address.\"},{\"q\":\"Are you based in Bologna, or do you cover the rest of Italy?\",\"a\":\"Bologna is a key hub for us — trade fairs and medical congresses especially — but we're based in Rome, printing since 2008, and we ship across Italy to Milan, Florence, Venice and beyond.\"}]};\n    const CITY_FAQ = FAQS[this.cityKey] || FAQS.Rome;\n    const faqItems = CITY_FAQ.map((qa, i) => {\n      const open = this.state.openFaq === i;\n      return {\n        q: qa.q,\n        a: qa.a,\n        sign: open ? \"\\u2212\" : \"+\",\n        onToggle: () => this.setState({ openFaq: open ? null : i }),\n        wrapStyle: { display: \"grid\", gridTemplateRows: open ? \"1fr\" : \"0fr\", transition: \"grid-template-rows 0.32s cubic-bezier(0.4,0,0.2,1)\", opacity: open ? 1 : 0 },\n      };\n    });\n\n    return {\n      clientsRef: this.clientsRef,\n      faqItems,\n      faqWhatsapp: WA,\n      cityName: C.name,\n      heroEyebrow: C.eyebrow,\n      heroTitle: C.title,\n      heroSub: C.sub,\n      focusTitle: C.focusTitle,\n      focusBody: C.focusBody,\n      venues: C.venues,\n      venueCards: C.venueCards || [],\n      hasVenueCards: !!(C.venueCards && C.venueCards.length),\n      noVenueCards: !(C.venueCards && C.venueCards.length),\n      sameDayBody: C.sameDay,\n      whatsappUrl: WA,\n      cities: [\"Rome\", \"Milan\", \"Florence\", \"Bologna\", \"Venice\", \"Other\"],\n      city: this.state.city,\n      onCity: (e) => this.setState({ city: e.target.value }),\n      materials: MATERIALS.map((label) => ({\n        label,\n        style: this.state.material === label ? selBtn : idleBtn,\n        onPick: () => this.setState({ material: label }),\n      })),\n      isOther: this.state.material === \"Other\",\n      otherMaterial: this.state.otherMaterial,\n      onOther: (e) => this.setState({ otherMaterial: e.target.value }),\n      info: this.state.info,\n      onInfo: (e) => this.setState({ info: e.target.value }),\n      deadline: this.state.deadline,\n      onDeadline: (e) => this.setState({ deadline: e.target.value }),\n      email: this.state.email,\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onSubmit,\n      stats: [\n        { num: \"2h\", label: \"Get prices in 2h\", sub: \"Chat now with a real person · Mon–Fri 8–12/15–18 · Sat 8-12 (CET)\", isLink: true, href: WA },\n        { num: this.cityKey === \"Rome\" ? \"Same-day\" : \"Next-day\", label: \"Print & ship\", plain: true },\n        { num: \"100+\", label: \"Clients / year\", plain: true },\n        { num: \"3\", label: \"Languages spoken\", plain: true },\n      ],\n      cities2: cities2.filter((c) => c.name !== this.cityKey),\n      products: [\n        { name: \"Business cards\", desc: \"Premium stocks and finishes, often ready the same day.\", img: true, imgEl: React.createElement(\"img\", { src: \"img/bv.webp\", alt: \"Business cards\", style: { width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" } }) },\n        { name: \"Brochures & depliants\", desc: \"Folded leaflets and booklets, adapted to Italian standards.\", img: true, imgEl: React.createElement(\"img\", { src: \"img/pieghevole-copia.webp\", alt: \"Brochures & depliants\", style: { width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" } }) },\n        { name: \"Roll-up banners\", desc: \"Anodized aluminium frames with carry bag included.\", img: true, imgEl: React.createElement(\"img\", { src: \"img/rollup.webp\", alt: \"Roll-up banners\", style: { width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" } }) },\n        { name: \"Posters & large format\", desc: \"Big, sharp and colour-true — perfect for trade-show walls.\", img: true, imgEl: React.createElement(\"img\", { src: \"img/posters.webp\", alt: \"Posters & large format\", style: { width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" } }) },\n        { name: \"Flyers & invitations\", desc: \"From a few cents a copy in bulk, premium finishes available.\", img: true, imgEl: React.createElement(\"img\", { src: \"img/Creative%20flyer%20design%20workspace%20flatlay.webp\", alt: \"Flyers & invitations\", style: { width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" } }) },\n        { name: \"Pre-spaced stickers\", desc: \"Custom cut decals to bring your branding to life.\", img: true, imgEl: React.createElement(\"img\", { src: \"img/0e62b2c0-436c-4d30-bdb0-ac2be470aedd%20copia%20kl.webp\", alt: \"Pre-spaced stickers\", style: { width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" } }) },\n      ],\n      steps: [\n        { n: \"01\", title: \"Send your files\", body: \"Any digital format. We check measurements and fix A4/US-Letter mismatches before printing.\" },\n        { n: \"02\", title: \"We print in Rome\", body: \"Dutch precision meets Italian print quality. Get a quote back within two hours.\" },\n        { n: \"03\", title: \"Delivered to you\", body: \"Straight to your hotel, stand or conference venue in \" + C.name + \" — on time.\" },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
