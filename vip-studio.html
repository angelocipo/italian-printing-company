document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

isplay:block; font-size:14px; font-weight:600; color:#1d1d1f;\">Shipping address<\u002Flabel>\n              <textarea name=\"shipping\" rows=\"3\" value=\"{{ f.shipping }}\" sc-camel-on-change=\"{{ set.shipping }}\" placeholder=\"Pickup point, commercial address, hotel, stand number — anything that helps the courier find you\" style=\"width:100%; margin-top:7px; font-size:16px; font-family:inherit; line-height:1.45; color:#1d1d1f; background:#fff; border:1px solid #e2e2e4; border-radius:13px; padding:13px 15px; resize:vertical; outline:none;\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin-top:14px;\">\n            <label style=\"display:block; font-size:14px; font-weight:600; color:#1d1d1f;\">Delivery destination <span style=\"color:#0071e3;\">*<\u002Fspan><\u002Flabel>\n            <sc-raw-select name=\"destination\" value=\"{{ f.zone }}\" sc-camel-on-change=\"{{ set.zone }}\" style=\"width:100%; margin-top:7px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#fff; border:1px solid #e2e2e4; border-radius:13px; padding:13px 15px; outline:none;\">\n              <option value=\"rome_s\">Same day Rome South / EUR / Center — Free<\u002Foption>\n              <option value=\"rome\">Same day rest of Rome — Free<\u002Foption>\n              <option value=\"it\">Italy (+1 day) — Free<\u002Foption>\n            <\u002Fsc-raw-select>\n            <p style=\"font-size:13px; color:#86868b; margin-top:8px;\">Shipping is set by the delivery address. No deliveries to Vatican City and outside EU. Outside Italy, request a quote and we confirm the rate.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"co-two\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;\">\n            <div>\n              <label style=\"display:block; font-size:14px; font-weight:600; color:#1d1d1f;\">Contact person at the venue <span style=\"color:#0071e3;\">*<\u002Fspan><\u002Flabel>\n              <input required=\"\" name=\"venue_contact\" value=\"{{ f.venueContact }}\" sc-camel-on-change=\"{{ set.venueContact }}\" placeholder=\"Who will be there to receive it\" style=\"width:100%; margin-top:7px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#fff; border:1px solid #e2e2e4; border-radius:13px; padding:13px 15px; outline:none;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block; font-size:14px; font-weight:600; color:#1d1d1f;\">Their mobile number <span style=\"color:#0071e3;\">*<\u002Fspan><\u002Flabel>\n              <input required=\"\" name=\"venue_phone\" value=\"{{ f.venuePhone }}\" sc-camel-on-change=\"{{ set.venuePhone }}\" placeholder=\"Cellphone, not a landline\" style=\"width:100%; margin-top:7px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#fff; border:1px solid #e2e2e4; border-radius:13px; padding:13px 15px; outline:none;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:13px; color:#86868b; margin-top:8px;\">We contact the venue before delivery to make sure they accept the goods.<\u002Fp>\n          <div style=\"margin-top:14px;\">\n            <label style=\"display:block; font-size:14px; font-weight:600; color:#1d1d1f;\">Deadline of the event <span style=\"color:#0071e3;\">*<\u002Fspan><\u002Flabel>\n            <input required=\"\" name=\"deadline\" value=\"{{ f.deadline }}\" sc-camel-on-change=\"{{ set.deadline }}\" placeholder=\"e.g. Thursday morning, before the fair opens\" style=\"width:100%; margin-top:7px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#fff; border:1px solid #e2e2e4; border-radius:13px; padding:13px 15px; outline:none;\">\n            <p style=\"font-size:13px; color:#86868b; margin-top:8px;\">Tell us the deadline and we confirm feasibility by email, before anything is charged.<\u002Fp>\n          <\u002Fdiv>\n\n          <h3 style=\"font-size:21px; font-weight:600; letter-spacing:-0.4px; margin-top:34px;\">Your artwork<\u002Fh3>\n          <label style=\"display:block; border:1px dashed #b9b9be; border-radius:14px; background:#fff; padding:18px; margin-top:16px; cursor:pointer;\">\n            <span style=\"display:block; font-size:15px; font-weight:600; color:#1d1d1f;\">Upload your design<\u002Fspan>\n            <span style=\"display:block; font-size:13px; color:#86868b; margin-top:4px;\">{{ fileLabel }}<\u002Fspan>\n            <input type=\"file\" name=\"attachment\" sc-camel-on-change=\"{{ set.file }}\" style=\"margin-top:12px; font-size:13px; font-family:inherit; color:#6e6e73;\">\n          <\u002Flabel>\n          <p style=\"font-size:13px; color:#86868b; margin-top:8px;\">Print-ready PDF at 100% final size with bleed where applicable — max 4 MB. Larger files: send the link below.<\u002Fp>\n          <div style=\"margin-top:14px;\">\n            <label style=\"display:block; font-size:14px; font-weight:600; color:#1d1d1f;\">Or paste a link to your file<\u002Flabel>\n            <input name=\"filelink\" value=\"{{ f.filelink }}\" sc-camel-on-change=\"{{ set.filelink }}\" placeholder=\"Canva editing link, WeTransfer, Drive, SwissTransfer…\" style=\"width:100%; margin-top:7px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#fff; border:1px solid #e2e2e4; border-radius:13px; padding:13px 15px; outline:none;\">\n            <p style=\"font-size:13px; color:#86868b; margin-top:8px;\">Share an unlocked link, no password.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;\">\n            <label style=\"display:block; font-size:14px; font-weight:600; color:#1d1d1f;\">Notes<\u002Flabel>\n            <textarea name=\"notes\" rows=\"3\" value=\"{{ f.notes }}\" sc-camel-on-change=\"{{ set.notes }}\" placeholder=\"Sizes and quantities per size, Pantone colours, print position, your designer's contact…\" style=\"width:100%; margin-top:7px; font-size:16px; font-family:inherit; line-height:1.45; color:#1d1d1f; background:#fff; border:1px solid #e2e2e4; border-radius:13px; padding:13px 15px; resize:vertical; outline:none;\"><\u002Ftextarea>\n          <\u002Fdiv>\n\n          <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-width:520px; margin:0 auto; border-top:1px solid rgba(0,0,0,0.1); margin-top:30px; padding-top:24px;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\">\n              <span style=\"font-size:19px; font-weight:600; letter-spacing:-0.4px;\">Subtotal<\u002Fspan>\n              <span style=\"font-size:28px; font-weight:700; letter-spacing:-1px;\">{{ totalLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:8px;\">\n              <span style=\"font-size:15px; font-weight:600; color:#86868b;\">Shipping — {{ shippingZoneLabel }}<\u002Fspan>\n              <span style=\"font-size:28px; font-weight:700; letter-spacing:-1px;\">{{ shippingCostLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; border-top:1px solid rgba(0,0,0,0.1); margin-top:14px; padding-top:14px;\">\n              <span style=\"font-size:19px; font-weight:600; letter-spacing:-0.4px;\">Total<\u002Fspan>\n              <span style=\"font-size:28px; font-weight:700; letter-spacing:-1px;\">{{ grandTotalLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:13px; color:#86868b; text-align:right; margin-top:4px;\">VAT included<\u002Fp>\n            <button type=\"submit\" disabled=\"{{ busy }}\" style=\"width:100%; margin-top:22px; background:#0071e3; color:#fff; border:none; font-size:18px; font-weight:500; font-family:inherit; padding:16px; border-radius:980px; cursor:pointer;\">{{ submitLabel }}<\u002Fbutton>\n            <p style=\"font-size:13px; color:#86868b; text-align:center; margin-top:12px;\">{{ submitHint }}<\u002Fp>\n            <div style=\"display:flex; align-items:center; gap:12px; margin:22px 0 18px;\">\n              <span style=\"flex:1; height:1px; background:rgba(0,0,0,0.1);\"><\u002Fspan>\n              <span style=\"font-size:12px; color:#86868b; letter-spacing:0.3px; text-transform:uppercase;\">or<\u002Fspan>\n              <span style=\"flex:1; height:1px; background:rgba(0,0,0,0.1);\"><\u002Fspan>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ onQuote }}\" style=\"width:100%; background:#fff; color:#1d1d1f; border:1px solid #d2d2d7; font-size:17px; font-weight:500; font-family:inherit; padding:15px; border-radius:980px; cursor:pointer;\">Request a formal quote instead<\u002Fbutton>\n            <p style=\"font-size:13px; color:#86868b; text-align:center; margin-top:12px;\">Same details, no payment. We send a signed quote and you pay on order.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fform>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1100px; margin:0 auto; padding:44px 22px 0;\">\n      <div style=\"background:#f5f5f7; border-radius:26px; padding:44px;\">\n        <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">Order conditions<\u002Fp>\n        <h2 style=\"font-size:clamp(26px,3.2vw,36px); line-height:1.1; font-weight:700; letter-spacing:-1px; margin-top:10px;\">Please read before you order.<\u002Fh2>\n        <ol style=\"margin:30px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:26px;\">\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">1<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">Comunicate the deadline of the event.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">2<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">Provide a name and cellphone number (not a landline please) of the contact person present at the venue, next to the address. We will contact the venue prior to delivery to ensure they’ll accept the goods.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">3<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">To avoid any misunderstandings, please note that production of the quoted materials is considered authorized and confirmed only once payment has been received and processed. An invoice will be issued and sent to you after payment has been received.<br><br>Production will commence only upon payment confirmation and will follow the agreed turnaround time. Any delay in payment will result in a corresponding delay in production and delivery.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">4<\u002Fspan>\n            <div>\n              <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">For production, I require either:<\u002Fp>\n              <ul style=\"margin:10px 0 0 20px; padding:0; font-size:16.5px; line-height:1.55; color:#1d1d1f;\">\n                <li style=\"margin-top:6px;\">A high-resolution print-ready PDF file at 100% final size, including bleed where applicable; or<\u002Fli>\n                <li style=\"margin-top:6px;\">A Canva editing link that allows me to access and modify the artwork if required for printing purposes.<\u002Fli>\n              <\u002Ful>\n              <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; margin-top:12px; text-wrap:pretty;\">To avoid errors, delays, and unnecessary revisions, I prefer to communicate directly with the graphic designer responsible for the artwork whenever possible. Direct communication helps prevent misunderstandings regarding file specifications, dimensions, bleed, resolution, colors, and other technical printing requirements.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">5<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">To ensure a more efficient and trouble-free delivery, we prefer to ship to pickup points or commercial addresses. This way, we guarantee you receive your package conveniently without any issue. Delivery date means delivery in the entire day, we can’t promise delivery at 8am. Preferably give a day extra for delivery, better safe than sorry.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">6<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">An invoice will be issued and sent to you after payment has been received. Can you share with me your complete business details for invoice purposes, so I can send you immediately an invoice.<\u002Fp>\n          <\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <section style=\"max-width:1100px; margin:0 auto; padding:56px 22px 20px;\">\n    <div class=\"vip-row\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px;\">\n      <div style=\"background:#f5f5f7; border-radius:20px; padding:40px;\">\n        <h3 style=\"font-size:22px; font-weight:600; letter-spacing:-0.4px;\">One piece is a real order<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.55; color:#6e6e73; margin-top:12px;\">No minimum quantity. A single embroidered polo gets the same proof and the same check before it ships as a run of five hundred.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:20px; padding:40px;\">\n        <h3 style=\"font-size:22px; font-weight:600; letter-spacing:-0.4px;\">A named contact<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.55; color:#6e6e73; margin-top:12px;\">You reply to the person who prints your job. English, Dutch or Italian, on WhatsApp or by email.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#f5f5f7; color:#86868b; font-size:12px; line-height:1.6; padding:40px 22px; text-align:center; margin-top:40px;\">\n    <div style=\"max-width:1100px; margin:0 auto;\">\n      <div style=\"border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:22px;\">\n        <div style=\"font-weight:600; color:#1d1d1f; font-size:14px;\">Italian Printing Company by Printing Italy di Angelo Cipolla. Via Lorenzo Bonincontri 26, 00147 Roma RM · P.IVA 02452700590<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:18px;\">A Dutch-Italian printing company based in Rome, serving international exhibitors across Italy.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst PRODUCTS = [\n  { id:\"posters\", name:\"1 foam board — A1, foam board 5mm no lamination, single sided full color Express print\", price:129,\n    description:\"Delivery UPS Priority Tuesday 8th september throughout the day, not programmable at a specific time. File send by September 4th 2026 before 9AM.\",\n    specs:[],\n    slotHint:\"\" }\n];\nconst ZONES = {\n  rome_s: { label:\"Same day Rome South / EUR / Center\", cost:0 },\n  rome:   { label:\"Same day rest of Rome\", cost:0 },\n  it:     { label:\"Italy (+1 day)\", cost:0 }\n};\nconst money = (n) => \"€ \" + n.toFixed(2).replace(\".\", \",\");\nconst ENDPOINT = \"https://formsubmit.co/ajax/info@italianprintingcompany.com\";\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const qty = {};\n    PRODUCTS.forEach(p => { qty[p.id] = 1; });\n    this.state = {\n      qty, busy: false, sent: false, error: \"\", file: null, reference: \"\",\n      f: { name:\"\", email:\"\", phone:\"\", company:\"\", vat:\"\", sdi:\"\", billing:\"\", shipping:\"\",\n           venueContact:\"\", venuePhone:\"\", deadline:\"\", filelink:\"\", notes:\"\", sameAddress:true, zone:\"rome_s\" }\n    };\n  }\n  componentDidMount() {\n    try {\n      const q = new URLSearchParams(window.location.search);\n      if (q.get(\"paid\") === \"1\") this.setState({ sent: true, reference: q.get(\"ref\") || \"\" });\n      else if (q.get(\"canceled\") === \"1\") this.setState({ error: \"Payment was canceled. Your order was not charged — you can try again below.\" });\n    } catch (e) {}\n  }\n  pay(ref) {\n    const f = this.state.f;\n    fetch(\"/api/create-checkout-session\", {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify({ zone: f.zone, ref: ref, email: f.email })\n    })\n      .then(r => r.json())\n      .then(d => {\n        if (d && d.url) { window.location.href = d.url; }\n        else this.setState({ busy: false, error: \"Could not start the payment. Your order was received by email — we will send you a payment link.\" });\n      })\n      .catch(() => this.setState({ busy: false, error: \"Could not start the payment. Your order was received by email — we will send you a payment link.\" }));\n  }\n  persist(qty) {\n    try { localStorage.setItem(\"ipc_vip_order\", JSON.stringify({ qty })); } catch (e) {}\n  }\n  bump(id, d) {\n    this.setState(s => {\n      const qty = Object.assign({}, s.qty, { [id]: Math.max(0, (s.qty[id] || 0) + d) });\n      this.persist(qty);\n      return { qty };\n    });\n  }\n  chosen() {\n    return PRODUCTS;\n  }\n  zone() {\n    return ZONES[this.state.f.zone] || ZONES.it;\n  }\n  total() {\n    return PRODUCTS.reduce((s,p) => s + p.price, 0);\n  }\n  summary() {\n    return PRODUCTS.map(p => p.name + \" — \" + money(p.price)).join(\"\\n\");\n  }\n  field(key) {\n    return (e) => {\n      const v = key === \"sameAddress\" ? e.target.checked : e.target.value;\n      this.setState(s => ({ f: Object.assign({}, s.f, { [key]: v }) }));\n    };\n  }\n  send(kind) {\n    const f = this.state.f;\n    const ref = \"VIP-\" + Math.random().toString(36).slice(2, 7).toUpperCase();\n    const total = this.total();\n    const data = new FormData();\n    data.append(\"_subject\", (kind === \"quote\" ? \"VIP quote request \" : \"VIP order \") + ref);\n    data.append(\"_captcha\", \"false\");\n    data.append(\"_template\", \"table\");\n    data.append(\"_replyto\", f.email);\n    data.append(\"_autoresponse\",\n      \"Thank you for your order, \" + (f.name || \"\") + \".\\n\\n\" +\n      \"Reference: \" + ref + \"\\n\\n\" +\n      this.summary() + \"\\n\\n\" +\n      \"Subtotal: \" + money(total) + \"\\n\" +\n      \"Shipping: \" + (this.zone().cost === 0 ? \"Free\" : money(this.zone().cost)) + \" — \" + this.zone().label + \"\\n\" +\n      \"Total: \" + money(total + this.zone().cost) + \" (VAT included)\\n\\n\" +\n      \"Payment is completed securely via Stripe at checkout. We check your file and confirm your deadline within one working day, then send the proof. Reply to this email if anything needs correcting.\\n\\n\" +\n      \"Italian Printing Company by Printing Italy di Angelo Cipolla\\n\" +\n      \"Via Lorenzo Bonincontri 26, 00147 Roma RM · P.IVA 02452700590\");\n    data.append(\"Reference\", ref);\n    data.append(\"Request type\", kind === \"quote\" ? \"Formal quote requested\" : \"Order placed\");\n    data.append(\"Order\", this.summary());\n    data.append(\"Total\", money(total));\n    data.append(\"Shipping\", (this.zone().cost === 0 ? \"Free\" : money(this.zone().cost)) + \" — \" + this.zone().label);\n    data.append(\"Grand total\", money(total + this.zone().cost));\n    data.append(\"Name\", f.name);\n    data.append(\"Email\", f.email);\n    data.append(\"Phone\", f.phone);\n    data.append(\"Company\", f.company || \"—\");\n    data.append(\"P. IVA / CF\", f.vat || \"—\");\n    data.append(\"Codice destinatario / PEC\", f.sdi || \"—\");\n    data.append(\"Billing address\", f.billing);\n    data.append(\"Shipping address\", f.sameAddress ? \"Same as billing\" : (f.shipping || \"—\"));\n    data.append(\"Venue contact\", f.venueContact || \"—\");\n    data.append(\"Venue mobile\", f.venuePhone || \"—\");\n    data.append(\"Deadline\", f.deadline);\n    data.append(\"File link\", f.filelink || \"—\");\n    data.append(\"Notes\", f.notes || \"—\");\n    if (this.state.file) data.append(\"attachment\", this.state.file);\n\n    this.setState({ busy: true, error: \"\" });\n    fetch(ENDPOINT, { method: \"POST\", body: data, headers: { Accept: \"application/json\" } })\n      .then(r => r.json())\n      .then(() => {\n        try { localStorage.removeItem(\"ipc_vip_order\"); } catch (e) {}\n        if (kind === \"order\") { this.setState({ reference: ref }); this.pay(ref); }\n        else this.setState({ busy: false, sent: true, reference: ref });\n      })\n      .catch(() => this.setState({ busy: false, error: \"Something went wrong. Please email info@italianprintingcompany.com — we will pick it up from there.\" }));\n  }\n  renderVals() {\n    const s = this.state;\n    const qty = s.qty;\n    const chosen = this.chosen();\n    const total = this.total();\n    return {\n      products: PRODUCTS.map(p => ({\n        slotId: \"vip-\" + p.id,\n        slotHint: p.slotHint,\n        name: p.name,\n        description: p.description,\n        specs: p.specs.map(label => ({ label })),\n        priceLabel: money(p.price),\n        qty: qty[p.id] || 0,\n        lineLabel: qty[p.id] > 0 ? money(p.price * qty[p.id]) + \" for \" + qty[p.id] + (qty[p.id] === 1 ? \" piece\" : \" pieces\") : \"Add to your order\",\n        onMinus: () => this.bump(p.id, -1),\n        onPlus: () => this.bump(p.id, 1)\n      })),\n      items: chosen.map(p => ({\n        title: p.name,\n        amount: money(p.price),\n        description: p.description\n      })),\n      isEmpty: chosen.length === 0,\n      totalLabel: money(total),\n      shippingCostLabel: this.zone().cost === 0 ? \"Free\" : money(this.zone().cost),\n      shippingZoneLabel: this.zone().label,\n      grandTotalLabel: money(total + this.zone().cost),\n      sent: s.sent,\n      notSent: !s.sent,\n      reference: s.reference,\n      f: s.f,\n      set: {\n        name: this.field(\"name\"), email: this.field(\"email\"), phone: this.field(\"phone\"),\n        company: this.field(\"company\"), vat: this.field(\"vat\"), sdi: this.field(\"sdi\"),\n        billing: this.field(\"billing\"), shipping: this.field(\"shipping\"),\n        venueContact: this.field(\"venueContact\"), venuePhone: this.field(\"venuePhone\"),\n        deadline: this.field(\"deadline\"), filelink: this.field(\"filelink\"),\n        notes: this.field(\"notes\"), sameAddress: this.field(\"sameAddress\"),\n        zone: this.field(\"zone\"),\n        file: (e) => this.setState({ file: e.target.files && e.target.files[0] ? e.target.files[0] : null })\n      },\n      differentAddress: !s.f.sameAddress,\n      fileLabel: s.file ? s.file.name : \"Drop it here or choose a file\",\n      busy: s.busy,\n      submitLabel: s.busy ? \"Sending…\" : \"Place the order\",\n      submitHint: s.error ? s.error : \"After submitting you are taken to secure payment (Stripe). Production is confirmed once payment has been received.\",\n      onSubmit: (e) => { e.preventDefault(); this.send(\"order\"); },\n      onQuote: () => {\n        const f = this.state.f;\n        if (!f.name || !f.email || !f.billing || !f.deadline) {\n          this.setState({ error: \"Please fill in name, email, billing address and deadline first.\" });\n          return;\n        }\n        this.send(\"quote\");\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
