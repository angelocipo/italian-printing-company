eline; gap:16px;\">\n              <span style=\"font-size:19px; font-weight:600; letter-spacing:-0.4px;\">Subtotal<\u002Fspan>\n              <span style=\"font-size:28px; font-weight:700; letter-spacing:-1px;\">{{ totalLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:8px;\">\n              <span style=\"font-size:15px; font-weight:600; color:#86868b;\">Shipping — {{ shippingZoneLabel }}<\u002Fspan>\n              <span style=\"font-size:28px; font-weight:700; letter-spacing:-1px;\">{{ shippingCostLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; border-top:1px solid rgba(0,0,0,0.1); margin-top:14px; padding-top:14px;\">\n              <span style=\"font-size:19px; font-weight:600; letter-spacing:-0.4px;\">Total<\u002Fspan>\n              <span style=\"font-size:28px; font-weight:700; letter-spacing:-1px;\">{{ grandTotalLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:13px; color:#86868b; text-align:right; margin-top:4px;\">VAT included<\u002Fp>\n            <button type=\"submit\" disabled=\"{{ busy }}\" style=\"width:100%; margin-top:22px; background:#0071e3; color:#fff; border:none; font-size:18px; font-weight:500; font-family:inherit; padding:16px; border-radius:980px; cursor:pointer;\">{{ submitLabel }}<\u002Fbutton>\n            <p style=\"font-size:13px; color:#86868b; text-align:center; margin-top:12px;\">{{ submitHint }}<\u002Fp>\n            <div style=\"display:flex; align-items:center; gap:12px; margin:22px 0 18px;\">\n              <span style=\"flex:1; height:1px; background:rgba(0,0,0,0.1);\"><\u002Fspan>\n              <span style=\"font-size:12px; color:#86868b; letter-spacing:0.3px; text-transform:uppercase;\">or<\u002Fspan>\n              <span style=\"flex:1; height:1px; background:rgba(0,0,0,0.1);\"><\u002Fspan>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ onQuote }}\" style=\"width:100%; background:#fff; color:#1d1d1f; border:1px solid #d2d2d7; font-size:17px; font-weight:500; font-family:inherit; padding:15px; border-radius:980px; cursor:pointer;\">Request a formal quote instead<\u002Fbutton>\n            <p style=\"font-size:13px; color:#86868b; text-align:center; margin-top:12px;\">Same details, no payment. We send a signed quote and you pay on order.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fform>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1100px; margin:0 auto; padding:44px 22px 0;\">\n      <div style=\"background:#f5f5f7; border-radius:26px; padding:44px;\">\n        <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">Order conditions<\u002Fp>\n        <h2 style=\"font-size:clamp(26px,3.2vw,36px); line-height:1.1; font-weight:700; letter-spacing:-1px; margin-top:10px;\">Please read before you order.<\u002Fh2>\n        <ol style=\"margin:30px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:26px;\">\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">1<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">Comunicate the deadline of the event.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">2<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">Provide a name and cellphone number (not a landline please) of the contact person present at the venue, next to the address. We will contact the venue prior to delivery to ensure they’ll accept the goods.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">3<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">To avoid any misunderstandings, please note that production of the quoted materials is considered authorized and confirmed only once payment has been received and processed. An invoice will be issued and sent to you after payment has been received.<br><br>Production will commence only upon payment confirmation and will follow the agreed turnaround time. Any delay in payment will result in a corresponding delay in production and delivery.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">4<\u002Fspan>\n            <div>\n              <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">For production, I require either:<\u002Fp>\n              <ul style=\"margin:10px 0 0 20px; padding:0; font-size:16.5px; line-height:1.55; color:#1d1d1f;\">\n                <li style=\"margin-top:6px;\">A high-resolution print-ready PDF file at 100% final size, including bleed where applicable; or<\u002Fli>\n                <li style=\"margin-top:6px;\">A Canva editing link that allows me to access and modify the artwork if required for printing purposes.<\u002Fli>\n              <\u002Ful>\n              <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; margin-top:12px; text-wrap:pretty;\">To avoid errors, delays, and unnecessary revisions, I prefer to communicate directly with the graphic designer responsible for the artwork whenever possible. Direct communication helps prevent misunderstandings regarding file specifications, dimensions, bleed, resolution, colors, and other technical printing requirements.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">5<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">To ensure a more efficient and trouble-free delivery, we prefer to ship to pickup points or commercial addresses. This way, we guarantee you receive your package conveniently without any issue. Delivery date means delivery in the entire day, we can’t promise delivery at 8am. Preferably give a day extra for delivery, better safe than sorry.<\u002Fp>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns:38px 1fr; gap:16px; align-items:start;\">\n            <span style=\"width:32px; height:32px; border-radius:50%; background:#1d1d1f; color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center;\">6<\u002Fspan>\n            <p style=\"font-size:16.5px; line-height:1.55; color:#1d1d1f; text-wrap:pretty;\">An invoice will be issued and sent to you after payment has been received. Can you share with me your complete business details for invoice purposes, so I can send you immediately an invoice.<\u002Fp>\n          <\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <section style=\"max-width:1100px; margin:0 auto; padding:56px 22px 20px;\">\n    <div class=\"vip-row\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px;\">\n      <div style=\"background:#f5f5f7; border-radius:20px; padding:40px;\">\n        <h3 style=\"font-size:22px; font-weight:600; letter-spacing:-0.4px;\">One piece is a real order<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.55; color:#6e6e73; margin-top:12px;\">No minimum quantity. A single embroidered polo gets the same proof and the same check before it ships as a run of five hundred.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f5f5f7; border-radius:20px; padding:40px;\">\n        <h3 style=\"font-size:22px; font-weight:600; letter-spacing:-0.4px;\">A named contact<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.55; color:#6e6e73; margin-top:12px;\">You reply to the person who prints your job. English, Dutch or Italian, on WhatsApp or by email.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#f5f5f7; color:#86868b; font-size:12px; line-height:1.6; padding:40px 22px; text-align:center; margin-top:40px;\">\n    <div style=\"max-width:1100px; margin:0 auto;\">\n      <div style=\"border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:22px;\">\n        <div style=\"font-weight:600; color:#1d1d1f; font-size:14px;\">Italian Printing Company by Printing Italy di Angelo Cipolla. Via Lorenzo Bonincontri 26, 00147 Roma RM · P.IVA 02452700590<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:18px;\">A Dutch-Italian printing company based in Rome, serving international exhibitors across Italy.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst PRODUCTS = [\n  { id:\"posters\", name:\"1 foam board — A1, foam board 5mm no lamination, single sided full color Express print\", price:129,\n    description:\"Delivery UPS Priority Tuesday 8th september throughout the day, not programmable at a specific time. File send by September 4th 2026 before 9AM.\",\n    specs:[],\n    slotHint:\"\" }\n];\nconst ZONES = {\n  rome_s: { label:\"Same day Rome South / EUR / Center\", cost:0 },\n  rome:   { label:\"Same day rest of Rome\", cost:0 },\n  it:     { label:\"Italy (+1 day)\", cost:0 }\n};\nconst money = (n) => \"€ \" + n.toFixed(2).replace(\".\", \",\");\nconst ENDPOINT = \"https://formsubmit.co/ajax/info@italianprintingcompany.com\";\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const qty = {};\n    PRODUCTS.forEach(p => { qty[p.id] = 1; });\n    this.state = {\n      qty, busy: false, sent: false, error: \"\", file: null, reference: \"\",\n      f: { name:\"\", email:\"\", phone:\"\", company:\"\", vat:\"\", sdi:\"\", billing:\"\", shipping:\"\",\n           venueContact:\"\", venuePhone:\"\", deadline:\"\", filelink:\"\", notes:\"\", sameAddress:true, zone:\"rome_s\" }\n    };\n  }\n  componentDidMount() {\n    try {\n      const q = new URLSearchParams(window.location.search);\n      if (q.get(\"paid\") === \"1\") this.setState({ sent: true, reference: q.get(\"ref\") || \"\" });\n      else if (q.get(\"canceled\") === \"1\") this.setState({ error: \"Payment was canceled. Your order was not charged — you can try again below.\" });\n    } catch (e) {}\n  }\n  pay(ref) {\n    const f = this.state.f;\n    fetch(\"/api/create-checkout-session\", {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify({ zone: f.zone, ref: ref, email: f.email })\n    })\n      .then(r => r.json())\n      .then(d => {\n        if (d && d.url) { window.location.href = d.url; }\n        else this.setState({ busy: false, error: \"Could not start the payment. Your order was received by email — we will send you a payment link.\" });\n      })\n      .catch(() => this.setState({ busy: false, error: \"Could not start the payment. Your order was received by email — we will send you a payment link.\" }));\n  }\n  persist(qty) {\n    try { localStorage.setItem(\"ipc_vip_order\", JSON.stringify({ qty })); } catch (e) {}\n  }\n  bump(id, d) {\n    this.setState(s => {\n      const qty = Object.assign({}, s.qty, { [id]: Math.max(0, (s.qty[id] || 0) + d) });\n      this.persist(qty);\n      return { qty };\n    });\n  }\n  chosen() {\n    return PRODUCTS;\n  }\n  zone() {\n    return ZONES[this.state.f.zone] || ZONES.it;\n  }\n  total() {\n    return PRODUCTS.reduce((s,p) => s + p.price, 0);\n  }\n  summary() {\n    return PRODUCTS.map(p => p.name + \" — \" + money(p.price)).join(\"\\n\");\n  }\n  field(key) {\n    return (e) => {\n      const v = key === \"sameAddress\" ? e.target.checked : e.target.value;\n      this.setState(s => ({ f: Object.assign({}, s.f, { [key]: v }) }));\n    };\n  }\n  send(kind) {\n    const f = this.state.f;\n    const ref = \"VIP-\" + Math.random().toString(36).slice(2, 7).toUpperCase();\n    const total = this.total();\n    const data = new FormData();\n    data.append(\"_subject\", (kind === \"quote\" ? \"VIP quote request \" : \"VIP order \") + ref);\n    data.append(\"_captcha\", \"false\");\n    data.append(\"_template\", \"table\");\n    data.append(\"_replyto\", f.email);\n    data.append(\"_autoresponse\",\n      \"Thank you for your order, \" + (f.name || \"\") + \".\\n\\n\" +\n      \"Reference: \" + ref + \"\\n\\n\" +\n      this.summary() + \"\\n\\n\" +\n      \"Subtotal: \" + money(total) + \"\\n\" +\n      \"Shipping: \" + (this.zone().cost === 0 ? \"Free\" : money(this.zone().cost)) + \" — \" + this.zone().label + \"\\n\" +\n      \"Total: \" + money(total + this.zone().cost) + \" (VAT included)\\n\\n\" +\n      \"Payment is completed securely via Stripe at checkout. We check your file and confirm your deadline within one working day, then send the proof. Reply to this email if anything needs correcting.\\n\\n\" +\n      \"Italian Printing Company by Printing Italy di Angelo Cipolla\\n\" +\n      \"Via Lorenzo Bonincontri 26, 00147 Roma RM · P.IVA 02452700590\");\n    data.append(\"Reference\", ref);\n    data.append(\"Request type\", kind === \"quote\" ? \"Formal quote requested\" : \"Order placed\");\n    data.append(\"Order\", this.summary());\n    data.append(\"Total\", money(total));\n    data.append(\"Shipping\", (this.zone().cost === 0 ? \"Free\" : money(this.zone().cost)) + \" — \" + this.zone().label);\n    data.append(\"Grand total\", money(total + this.zone().cost));\n    data.append(\"Name\", f.name);\n    data.append(\"Email\", f.email);\n    data.append(\"Phone\", f.phone);\n    data.append(\"Company\", f.company || \"—\");\n    data.append(\"P. IVA / CF\", f.vat || \"—\");\n    data.append(\"Codice destinatario / PEC\", f.sdi || \"—\");\n    data.append(\"Billing address\", f.billing);\n    data.append(\"Shipping address\", f.sameAddress ? \"Same as billing\" : (f.shipping || \"—\"));\n    data.append(\"Venue contact\", f.venueContact || \"—\");\n    data.append(\"Venue mobile\", f.venuePhone || \"—\");\n    data.append(\"Deadline\", f.deadline);\n    data.append(\"File link\", f.filelink || \"—\");\n    data.append(\"Notes\", f.notes || \"—\");\n    if (this.state.file) data.append(\"attachment\", this.state.file);\n\n    this.setState({ busy: true, error: \"\" });\n    fetch(ENDPOINT, { method: \"POST\", body: data, headers: { Accept: \"application/json\" } })\n      .then(r => r.json())\n      .then(() => {\n        try { localStorage.removeItem(\"ipc_vip_order\"); } catch (e) {}\n        if (kind === \"order\") { this.setState({ reference: ref }); this.pay(ref); }\n        else this.setState({ busy: false, sent: true, reference: ref });\n      })\n      .catch(() => this.setState({ busy: false, error: \"Something went wrong. Please email info@italianprintingcompany.com — we will pick it up from there.\" }));\n  }\n  renderVals() {\n    const s = this.state;\n    const qty = s.qty;\n    const chosen = this.chosen();\n    const total = this.total();\n    return {\n      products: PRODUCTS.map(p => ({\n        slotId: \"vip-\" + p.id,\n        slotHint: p.slotHint,\n        name: p.name,\n        description: p.description,\n        specs: p.specs.map(label => ({ label })),\n        priceLabel: money(p.price),\n        qty: qty[p.id] || 0,\n        lineLabel: qty[p.id] > 0 ? money(p.price * qty[p.id]) + \" for \" + qty[p.id] + (qty[p.id] === 1 ? \" piece\" : \" pieces\") : \"Add to your order\",\n        onMinus: () => this.bump(p.id, -1),\n        onPlus: () => this.bump(p.id, 1)\n      })),\n      items: chosen.map(p => ({\n        title: p.name,\n        amount: money(p.price),\n        description: p.description\n      })),\n      isEmpty: chosen.length === 0,\n      totalLabel: money(total),\n      shippingCostLabel: this.zone().cost === 0 ? \"Free\" : money(this.zone().cost),\n      shippingZoneLabel: this.zone().label,\n      grandTotalLabel: money(total + this.zone().cost),\n      sent: s.sent,\n      notSent: !s.sent,\n      reference: s.reference,\n      f: s.f,\n      set: {\n        name: this.field(\"name\"), email: this.field(\"email\"), phone: this.field(\"phone\"),\n        company: this.field(\"company\"), vat: this.field(\"vat\"), sdi: this.field(\"sdi\"),\n        billing: this.field(\"billing\"), shipping: this.field(\"shipping\"),\n        venueContact: this.field(\"venueContact\"), venuePhone: this.field(\"venuePhone\"),\n        deadline: this.field(\"deadline\"), filelink: this.field(\"filelink\"),\n        notes: this.field(\"notes\"), sameAddress: this.field(\"sameAddress\"),\n        zone: this.field(\"zone\"),\n        file: (e) => this.setState({ file: e.target.files && e.target.files[0] ? e.target.files[0] : null })\n      },\n      differentAddress: !s.f.sameAddress,\n      fileLabel: s.file ? s.file.name : \"Drop it here or choose a file\",\n      busy: s.busy,\n      submitLabel: s.busy ? \"Sending…\" : \"Place the order\",\n      submitHint: s.error ? s.error : \"After submitting you are taken to secure payment (Stripe). Production is confirmed once payment has been received.\",\n      onSubmit: (e) => { e.preventDefault(); this.send(\"order\"); },\n      onQuote: () => {\n        const f = this.state.f;\n        if (!f.name || !f.email || !f.billing || !f.deadline) {\n          this.setState({ error: \"Please fill in name, email, billing address and deadline first.\" });\n          return;\n        }\n        this.send(\"quote\");\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
