    // degraded state as a refused embed.

      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

n        <\u002Fsc-if>\n        <sc-if value=\"{{ c.plainName }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f5f5f7; border-radius:22px; padding:34px 32px;\">\n            <h3 style=\"font-size:24px; font-weight:600; letter-spacing:-0.5px;\">{{ c.name }}<\u002Fh3>\n            <p style=\"font-size:16px; color:#6e6e73; line-height:1.5; margin-top:10px;\">{{ c.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section id=\"faq\" style=\"max-width:820px; margin:104px auto 0; padding:0 22px;\">\n    <div style=\"text-align:center; margin-bottom:34px;\">\n      <p style=\"font-size:14px; font-weight:600; color:#0071e3; letter-spacing:0.4px; text-transform:uppercase;\">FAQ<\u002Fp>\n      <h2 style=\"font-size:clamp(32px,4vw,48px); font-weight:700; letter-spacing:-1.4px; margin-top:12px; line-height:1.08;\">Questions from international exhibitors.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"border-bottom:1px solid rgba(0,0,0,0.1);\">\n      <sc-for list=\"{{ faqItems }}\" as=\"f\" hint-placeholder-count=\"7\">\n        <div style=\"border-top:1px solid rgba(0,0,0,0.1);\">\n          <button sc-camel-on-click=\"{{ f.onToggle }}\" style=\"width:100%; display:flex; justify-content:space-between; align-items:center; gap:24px; background:none; border:none; padding:26px 2px; cursor:pointer; text-align:left; font-family:inherit;\">\n            <span style=\"font-size:20px; font-weight:600; letter-spacing:-0.4px; color:#1d1d1f; line-height:1.3;\">{{ f.q }}<\u002Fspan>\n            <span style=\"font-size:26px; line-height:1; color:#0071e3; font-weight:400; flex-shrink:0;\">{{ f.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"{{ f.wrapStyle }}\">\n            <div style=\"overflow:hidden;\">\n              <p style=\"font-size:17px; color:#6e6e73; line-height:1.55; padding:0 2px 28px; max-width:700px;\">{{ f.a }}<\u002Fp>\n  line-height:1.05;\">Get prices in two hours.<\u002Fh2>\n      <p style=\"font-size:21px; color:#a1a1a6; margin-top:18px; max-width:560px; margin-left:auto; margin-right:auto; letter-spacing:-0.3px;\">Tell us about your event and what you need. We reply Mon–Fri 8–12/15–18 · Sat 8-12 (CET).<\u002Fp>\n    <\u002Fdiv>\n\n    <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"max-width:680px; margin:46px auto 0; background:#fff; color:#1d1d1f; border-radius:28px; padding:44px; text-align:left;\">\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px;\">The event is in<\u002Flabel>\n      <sc-raw-select value=\"{{ city }}\" sc-camel-on-change=\"{{ onCity }}\" style=\"width:100%; margin-top:10px; font-size:17px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; appearance:none; -webkit-appearance:none; outline:none;\">\n        <option value=\"Rome\">Rome<\u002Foption>\n        <option value=\"Milan\">Milan<\u002Foption>\n        <option value=\"Florence\">Florence<\u002Foption>\n        <option value=\"Bologna\">Bologna<\u002Foption>\n        <option value=\"Venice\">Venice<\u002Foption>\n        <option value=\"Other\">Other<\u002Foption>\n      <\u002Fsc-raw-select>\n\n      <div style=\"font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">What do you need us to print?<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;\">\n        <sc-for list=\"{{ materials }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ m.onPick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isOther }}\" hint-placeholder-val=\"{{ false }}\">\n        <input value=\"{{ otherMaterial }}\" sc-camel-on-change=\"{{ onOther }}\" placeholder=\"Tell us what you need\" style=\"width:100%; margin-top:12px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:13px 16px; outline:none;\">\n      <\u002Fsc-if>\n\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">Other information<\u002Flabel>\n      <textarea value=\"{{ info }}\" sc-camel-on-change=\"{{ onInfo }}\" rows=\"4\" placeholder=\"Quantities, sizes, finishes, file details…\" style=\"width:100%; margin-top:10px; font-size:16px; font-family:inherit; line-height:1.45; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; resize:vertical; outline:none;\"><\u002Ftextarea>\n\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">When is your deadline?<\u002Flabel>\n      <input value=\"{{ deadline }}\" sc-camel-on-change=\"{{ onDeadline }}\" placeholder=\"e.g. Thursday morning, before the fair opens\" style=\"width:100%; margin-top:10px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; outline:none;\">\n\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">Your email address for our reply <span style=\"color:#0071e3;\">*<\u002Fspan><\u002Flabel>\n      <input type=\"email\" required=\"\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@company.com\" style=\"width:100%; margin-top:10px; font-size:16px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; outline:none;\">\n\n      <button type=\"submit\" style=\"width:100%; margin-top:32px; background:#0071e3; color:#fff; border:none; font-size:18px; font-weight:500; font-family:inherit; padding:16px; border-radius:980px; cursor:pointer;\">Request my quote<\u002Fbutton>\n      <p style=\"font-size:13px; color:#86868b; text-align:center; margin-top:14px;\">Opens your email app with everything filled in — just hit send.<\u002Fp>\n    <\u002Fform>\n\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#f5f5f7; color:#86868b; font-size:12px; line-height:1.6; padding:40px 22px; text-align:center;\">\n    <div style=\"max-width:1024px; margin:0 auto;\">\n      <div style=\"border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:22px;\">\n        <div style=\"font-weight:600; color:#1d1d1f; font-size:14px;\">Italian Printing Company by Printing Italy di Angelo Cipolla. Via Lorenzo Bonincontri 26, 00147 Roma RM · P.IVA 02452700590<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:18px;\">A Dutch-Italian printing company based in Rome, serving international exhibitors across Italy. Overnight printing service available. Concept redesign.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.cityKey = \"Milan\"; /* CITY_KEY */\n    this.clientsRef = React.createRef();\n    this.state = { city: this.cityKey, material: \"Business Cards\", otherMaterial: \"\", info: \"\", deadline: \"\", email: \"\", openFaq: null };\n  }\n  componentDidMount() {\n    this.initEmbedResize();\n    this.initClients();\n  }\n  initEmbedResize() {\n    if (window.parent === window) return;\n    const post = () => {\n      const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);\n      window.parent.postMessage({ ipcEmbedHeight: h }, \"*\");\n    };\n    if (window.ResizeObserver) {\n      this._embedRO = new ResizeObserver(post);\n      this._embedRO.observe(document.body);\n    }\n    window.addEventListener(\"load\", post);\n    window.addEventListener(\"resize\", post);\n    setTimeout(post, 300);\n    setTimeout(post, 1200);\n  }\n  initClients() {\n    const root = this.clientsRef.current;\n    if (!root || root.dataset.ready) return;\n    root.dataset.ready = \"1\";\n    if (!document.getElementById(\"ipc-clients-style\")) {\n      const st = document.createElement(\"style\");\n      st.id = \"ipc-clients-style\";\n      st.textContent = `\n        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');\n        .ipc-clients{--ink:#0e0d0c;--paper:#f3eee3;--cyan:#00aeef;--magenta:#ec008c;--yellow:#c9a227;--slate:#8a8580;--line:rgba(14,13,12,0.18);--transition-speed:700ms;position:relative;width:100%;background:var(--paper);font-family:'Inter',sans-serif;padding:80px 28px 88px;overflow:hidden;box-sizing:border-box;margin-top:104px;}\n        .ipc-clients *{box-sizing:border-box;}\n        .ipc-clients .crop{position:absolute;width:22px;height:22px;z-index:5;opacity:.45;pointer-events:none;}\n        .ipc-clients .crop::before,.ipc-clients .crop::after{content:'';position:absolute;background:var(--ink);}\n        .ipc-clients .crop::before{width:100%;height:1px;top:0;left:0;}\n        .ipc-clients .crop::after{width:1px;height:100%;top:0;left:0;}\n        .ipc-clients .crop-tl{top:18px;left:18px;}\n        .ipc-clients .crop-tr{top:18px;right:18px;transform:scaleX(-1);}\n        .ipc-clients .crop-bl{bottom:18px;left:18px;transform:scaleY(-1);}\n        .ipc-clients .crop-br{bottom:18px;right:18px;transform:scale(-1,-1);}\n        .ipc-clients .clients-head{max-width:1080px;margin:0 auto 44px;text-align:center;}\n        .ipc-clients .job-ticket{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);margin-bottom:10px;}\n        .ipc-clients .job-ticket .job-num{color:var(--ink);}\n        .ipc-clients .clients-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;text-transform:upp ty: \" + this.state.city,\n        \"Material: \" + mat,\n        \"Other information: \" + (this.state.info || \"—\"),\n        \"Deadline: \" + (this.state.deadline || \"—\"),\n        \"Reply to: \" + (this.state.email || \"—\"),\n      ];\n      const subject = \"Quote request — \" + mat + \" (\" + this.state.city + \")\";\n      const url = \"mailto:info@italianprintingcompany.com?subject=\" + encodeURIComponent(subject) + \"&body=\" + encodeURIComponent(lines.join(\"\\n\"));\n      window.location.href = url;\n    };\n\n    const CITY_LINKS = {\n      Rome: \"rome.html\",\n      Milan: \"milan.html\",\n      Florence: \"florence.html\",\n      Bologna: \"bologna.html\",\n    };\n    const cities2 = [\n      { name: \"Rome\", img: \"img/roma500.webp\", url: CITY_LINKS.Rome, body: \"Our home base in the EUR district — same-day pickup for urgent jobs, with delivery to Fiera di Roma, La Nuvola, Palazzo dei Congressi and hotels across the city center.\" },\n      { name: \"Milan\", img: \"img/milan500.webp\", url: CITY_LINKS.Milan, body: \"Overnight shipping to MiCo, Fiera Milano (Rho), Allianz MiCo and any hotel in the city. Order by evening, receive by morning.\" },\n      { name: \"Florence\", img: \"img/florence500.webp\", url: CITY_LINKS.Florence, body: \"For events at Fortezza da Basso, Palazzo dei Congressi and the city's Renaissance venues — delivery available city-wide.\" },\n      { name: \"Bologna\", img: \"img/bologna500.webp\", url: CITY_LINKS.Bologna, body: \"A key hub for trade fairs and medical congresses, with regular delivery to BolognaFiere and surrounding hotels.\" },\n      { name: \"Venice, Turin, Naples & beyond\", plainName: true, body: \"We ship throughout Italy. Wherever your event is, send us your files and we'll arrange delivery. Italy is our territory.\" },\n    ];\n\n    const FAQS = {\"Rome\":[{\"q\":\"Can you deliver printing to my hotel or exhibition stand in Rome?\",\"a\":\"Yes. We deliver across Rome — to Fiera di Roma, the La Nuvola Convention Centre, Palazzo dei Congressi and hotels from EUR to the city centre — straight to your hotel room, your stand or the venue's front desk. Our base is in the EUR district, so for urgent jobs we can even arrange same-day pickup and drop-off.\"},{\"q\":\"How fast can I get printing done in Rome as a last-minute exhibitor?\",\"a\":\"Send your files in the morning and we can often have the finished pieces ready by the afternoon, delivered the same day within Rome. Message us on WhatsApp and we'll confirm the timing for your specific job in minutes.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Rome do you serve?\",\"a\":\"Regularly Fiera di Roma, the La Nuvola Convention Centre and Palazzo dei Congressi in EUR, plus hotels across Parioli, Trastevere and the historic centre. If your event is somewhere else in Rome, just send us the address.\"},{\"q\":\"Do you only cover Rome, or the rest of Italy too?\",\"a\":\"Rome is our home — we've printed here since 2008 and know the city's delivery routes inside out — but we ship across Italy to Milan, Florence, Bologna, Venice and beyond. Wherever your event is, send your files and we'll arrange delivery.\"}],\"Milan\":[{\"q\":\"Can you deliver printing to my hotel or stand in Milan?\",\"a\":\"Yes. We ship overnight to Milan and deliver to MiCo – Milano Congressi, Fiera Milano in Rho, Allianz MiCo and any hotel in the city — straight to your stand, your room or the venue desk. Order by evening and it's with you by morning.\"},{\"q\":\"How fast can I get printing done in Milan?\",\"a\":\"Order by evening and your printing is delivered the next day across Milan — to your stand, hotel or the venue desk. Message us on WhatsApp and we'll confirm the exact timing for your fair in minutes.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Milan do you serve?\",\"a\":\"MiCo – Milano Congressi, Fiera Milano (Rho), Allianz MiCo and city-centre hotels. If your event is anywhere else in Milan, just give us the address.\"},{\"q\":\"Are you based in Milan, or do you cover the rest of Italy?\",\"a\":\"We ship overnight to Milan but we're based in Rome, where we've printed since 2008. We also cover Florence, Bologna, Venice and the rest of Italy — send your files wherever your event is.\"}],\"Florence\":[{\"q\":\"Can you deliver printing to my hotel or stand in Florence?\",\"a\":\"Yes. We deliver city-wide in Florence — to Fortezza da Basso, the Palazzo dei Congressi and the city's Renaissance congress venues, as well as your hotel or stand. Tell us the address and we handle the rest.\"},{\"q\":\"How fast can I get printing done in Florence?\",\"a\":\"Send us your files and we deliver the next day across Florence — to your hotel, stand or venue. Message us on WhatsApp to confirm the timing for your job.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Florence do you serve?\",\"a\":\"Fortezza da Basso, the Palazzo dei Congressi and Florence's historic congress venues, plus hotels city-wide. Anywhere else in Florence, just send us the address.\"},{\"q\":\"Are you based in Florence, or do you cover the rest of Italy?\",\"a\":\"We deliver throughout Florence but we're Rome-based, printing since 2008, and we also serve Milan, Bologna, Venice and the rest of Italy. Send your files wherever your event is.\"}],\"Bologna\":[{\"q\":\"Can you deliver printing to my hotel or stand in Bologna?\",\"a\":\"Yes. We deliver regularly to BolognaFiere, the Bologna Convention Centre and surrounding hotels — straight to your stand, your room or the venue desk. It's a route we run often for trade fairs and medical congresses.\"},{\"q\":\"How fast can I get printing done in Bologna?\",\"a\":\"Send us your files and we deliver the next day to BolognaFiere or your hotel. Message us on WhatsApp to lock in the timing for your job.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Bologna do you serve?\",\"a\":\"BolognaFiere, the Bologna Convention Centre and the hotels around the fair district. Anywhere else in Bologna, just send us the address.\"},{\"q\":\"Are
