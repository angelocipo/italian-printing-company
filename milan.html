  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <p style=\"font-size:13px; color:#86868b; margin-top:14px;\">We reply Mon–Fri 8–12/15–18 · Sat 8-12 (CET).<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- QUOTE CTA + FORM -->\n  <section id=\"quote\" style=\"background:#1d1d1f; color:#f5f5f7; margin-top:104px; padding:110px 22px;\">\n    <div style=\"max-width:680px; margin:0 auto; text-align:center;\">\n      <h2 style=\"font-size:clamp(38px,5vw,60px); font-weight:700; letter-spacing:-2px; line-height:1.05;\">Get prices in two hours.<\u002Fh2>\n      <p style=\"font-size:21px; color:#a1a1a6; margin-top:18px; max-width:560px; margin-left:auto; margin-right:auto; letter-spacing:-0.3px;\">Tell us about your event and what you need. We reply Mon–Fri 8–12/15–18 · Sat 8-12 (CET).<\u002Fp>\n    <\u002Fdiv>\n\n    <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"max-width:680px; margin:46px auto 0; background:#fff; color:#1d1d1f; border-radius:28px; padding:44px; text-align:left;\">\n      <label style=\"display:block; font-size:17px; font-weight:600; letter-spacing:-0.3px;\">The event is in<\u002Flabel>\n      <sc-raw-select value=\"{{ city }}\" sc-camel-on-change=\"{{ onCity }}\" style=\"width:100%; margin-top:10px; font-size:17px; font-family:inherit; color:#1d1d1f; background:#f5f5f7; border:1px solid #e2e2e4; border-radius:14px; padding:14px 16px; appearance:none; -webkit-appearance:none; outline:none;\">\n        <option value=\"Rome\">Rome<\u002Foption>\n        <option value=\"Milan\">Milan<\u002Foption>\n        <option value=\"Florence\">Florence<\u002Foption>\n        <option value=\"Bologna\">Bologna<\u002Foption>\n        <option value=\"Venice\">Venice<\u002Foption>\n        <option value=\"Other\">Other<\u002Foption>\n      <\u002Fsc-raw-select>\n\n      <div style=\"font-size:17px; font-weight:600; letter-spacing:-0.3px; margin-top:28px;\">What do you need us to print?<\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;\">\n        <sc-for list=\"{{ materi     const post = () => {\n      const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);\n      window.parent.postMessage({ ipcEmbedHeight: h }, \"*\");\n    };\n    if (window.ResizeObserver) {\n      this._embedRO = new ResizeObserver(post);\n      this._embedRO.observe(document.body);\n    }\n    window.addEventListener(\"load\", post);\n    window.addEventListener(\"resize\", post);\n    setTimeout(post, 300);\n    setTimeout(post, 1200);\n  }\n  initClients() {\n    const root = this.clientsRef.current;\n    if (!root || root.dataset.ready) return;\n    root.dataset.ready = \"1\";\n    if (!document.getElementById(\"ipc-clients-style\")) {\n      const st = document.createElement(\"style\");\n      st.id = \"ipc-clients-style\";\n      st.textContent = `\n        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');\n        .ipc-clients{--ink:#0e0d0c;--paper:#f3eee3;--cyan:#00aeef;--magenta:#ec008c;--yellow:#c9a227;--slate:#8a8580;--line:rgba(14,13,12,0.18);--transition-speed:700ms;position:relative;width:100%;background:var(--paper);font-family:'Inter',sans-serif;padding:80px 28px 88px;overflow:hidden;box-sizing:border-box;margin-top:104px;}\n        .ipc-clients *{box-sizing:border-box;}\n        .ipc-clients .crop{position:absolute;width:22px;height:22px;z-index:5;opacity:.45;pointer-events:none;}\n        .ipc-clients .crop::before,.ipc-clients .crop::after{content:'';position:absolute;background:var(--ink);}\n        .ipc-clients .crop::before{width:100%;height:1px;top:0;left:0;}\n        .ipc-clients .crop::after{width:1px;height:100%;top:0;left:0;}\n        .ipc-clients .crop-tl{top:18px;left:18px;}\n        .ipc-clients .crop-tr{top:18px;right:18px;transform:scaleX(-1);}\n        .ipc-clients .crop-bl{bottom:18px;left:18px;transform:scaleY(-1);}\n        .ipc-clients .crop-br{bottom:18px;right:18px;transform:scale ce\").children);\n    const pagesWrap = root.querySelector(\"#ipcLogoPages\");\n    const dotsWrap = root.querySelector(\"#ipcNavDots\");\n    const prevBtn = root.querySelector(\".arrow.prev\");\n    const nextBtn = root.querySelector(\".arrow.next\");\n    const SLIDE_DURATION = 5000;\n    const reduceMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    let pages = [], current = 0, timer = null, resizeTO = null;\n    const itemsPerPage = () => {\n      const w = window.innerWidth;\n      if (w < 560) return 2;\n      if (w < 900) return 3;\n      if (w < 1280) return 4;\n      return 5;\n    };\n    const chunk = (arr, size) => { const out = []; for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size)); return out; };\n    const buildDots = (count) => {\n      dotsWrap.innerHTML = \"\";\n      for (let i = 0; i < count; i++) {\n        const btn = document.createElement(\"button\");\n        btn.className = \"dot\";\n        btn.setAttribute(\"role\", \"tab\");\n        btn.setAttribute(\"aria-label\", \"Go to logo page \" + (i + 1));\n        btn.innerHTML = '<svg class=\"dot-ring\" viewBox=\"0 0 26 26\"><circle cx=\"13\" cy=\"13\" r=\"10\"><\u002Fcircle><circle class=\"dot-progress\" cx=\"13\" cy=\"13\" r=\"10\" transform=\"rotate(-90 13 13)\"><\u002Fcircle><\u002Fsvg>';\n        btn.addEventListener(\"click\", () => goTo(i, true));\n        dotsWrap.appendChild(btn);\n      }\n    };\n    const resetRing = (dot) => { const r = dot.querySelector(\".dot-progress\"); r.style.transition = \"none\"; r.style.strokeDashoffset = \"62.8\"; };\n    const runRing = (dot) => {\n      const r = dot.querySelector(\".dot-progress\"); resetRing(dot);\n      if (reduceMotion) return;\n      requestAnimationFrame(() => requestAnimationFrame(() => {\n        r.style.transition = \"stroke-dashoffset \" + SLIDE_DURATION + \"ms linear\";\n        r.style.strokeDashoffset = \"0\";\n      }));\n    };\n    const showPage = (index) => {\n      current = (index + pages.length) % pages.length;\n      pages.forEach((p, i) => p.classList.toggle(\"active\", i === current));\n      const dots = Array.from(dotsWrap.children);\n      dots.forEach((d, i) => { d.classList.toggle(\"active\", i === current); if (i === current) runRing(d); else resetRing(d); });\n      const ticket = root.querySelector(\".job-ticket\");\n      ticket.innerHTML = 'Clients № <span class=\"job-num\">' + String(current + 1).padStart(2, \"0\") + \"<\u002Fspan>/\" + String(pages.length).padStart(2, \"0\");\n    };\n    const goTo = (index, user) => { showPage(index); if (user) restartTimer(); };\n    const next = () => goTo(current + 1);\n    const prevPage = () => goTo(current - 1);\n    const restartTimer = () => { clearInterval(timer); if (pages.length > 1) timer = setInterval(next, SLIDE_DURATION); };\n    const rebuild = () => {\n      const grouped = chunk(source, itemsPerPage());\n      pagesWrap.innerHTML = \"\";\n      grouped.forEach((group) => { const page = document.createElement(\"div\"); page.className = \"logo-page\"; group.forEach((n) => page.appendChild(n.cloneNode(true))); pagesWrap.appendChild(page); });\n      pages = Array.from(pagesWrap.children);\n      buildDots(pages.length);\n      current = 0; showPage(0);\n    };\n    prevBtn.addEventListener(\"click\", () => { prevPage(); restartTimer(); });\n    nextBtn.addEventListener(\"click\", () => { next(); restartTimer(); });\n    let touchStartX = 0;\n    root.addEventListener(\"touchstart\", (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });\n    root.addEventListener(\"touchend\", (e) => { const dx = e.changedTouches[0].clientX - touchStartX; if (Math.abs(dx) > 40) { dx < 0 ? next() : prevPage(); restartTimer(); } }, { passive: true });\n    this._clientsResize = () => { clearTimeout(resizeTO); resizeTO = setTimeout(rebuild, 200); };\n    window.addEventListener(\"resize\", this._clientsResize);\n    this._clientsTimerClear = () => clearInter mily:inherit; cursor:pointer; padding:11px 20px; border-radius:980px; border:1px solid #0071e3; background:#0071e3; color:#fff;\";\n    const idleBtn = \"font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; padding:11px 20px; border-radius:980px; border:1px solid #e2e2e4; background:#f5f5f7; color:#1d1d1f;\";\n    const onSubmit = (e) => {\n      e.preventDefault();\n      const mat = this.state.material === \"Other\" ? \"Other: \" + (this.state.otherMaterial || \"—\") : this.state.material;\n      const lines = [\n        \"Event city: \" + this.state.city,\n        \"Material: \" + mat,\n        \"Other information: \" + (this.state.info || \"—\"),\n        \"Deadline: \" + (this.state.deadline || \"—\"),\n        \"Reply to: \" + (this.state.email || \"—\"),\n      ];\n      const subject = \"Quote request — \" + mat + \" (\" + this.state.city + \")\";\n      const url = \"mailto:info@italianprintingcompany.com?subject=\" + encodeURIComponent(subject) + \"&body=\" + encodeURIComponent(lines.join(\"\\n\"));\n      window.location.href = url;\n    };\n\n    const CITY_LINKS = {\n      Rome: \"rome.html\",\n      Milan: \"milan.html\",\n      Florence: \"florence.html\",\n      Bologna: \"bologna.html\",\n    };\n    const cities2 = [\n      { name: \"Rome\", img: \"img/roma500.webp\", url: CITY_LINKS.Rome, body: \"Our home base in the EUR district — same-day pickup for urgent jobs, with delivery to Fiera di Roma, La Nuvola, Palazzo dei Congressi and hotels across the city center.\" },\n      { name: \"Milan\", img: \"img/milan500.webp\", url: CITY_LINKS.Milan, body: \"Printed and shipped within 24h to MiCo, Fiera Milano (Rho), Allianz MiCo and any hotel in the city. Delivered 1–2 days later.\" },\n      { name: \"Florence\", img: \"img/florence500.webp\", url: CITY_LINKS.Florence, body: \"For events at Fortezza da Basso, Palazzo dei Congressi and the city's Renaissance venues — delivery available city-wide.\" },\n      { name: \"Bologna\", img: \"img/bologna500.webp\", url: CITY_LINKS.Bologna, body: \"A key hub for trade fairs and medical congresses, with regular delivery to BolognaFiere and surrounding hotels.\" },\n      { name: \"Venice, Turin, Naples & beyond\", plainName: true, body: \"We ship throughout Italy. Wherever your event is, send us your files and we'll arrange delivery. Italy is our territory.\" },\n    ];\n\n    const FAQS = {\"Rome\":[{\"q\":\"Can you deliver printing to my hotel or exhibition stand in Rome?\",\"a\":\"Yes. We deliver across Rome — to Fiera di Roma, the La Nuvola Convention Centre, Palazzo dei Congressi and hotels from EUR to the city centre — straight to your hotel room, your stand or the venue's front desk. Our base is in the EUR district, so for urgent jobs we can even arrange same-day pickup and drop-off.\"},{\"q\":\"How fast can I get printing done in Rome as a last-minute exhibitor?\",\"a\":\"Send your files in the morning and we can often have the finished pieces ready by the afternoon, delivered the same day within Rome. Message us on WhatsApp and we'll confirm the timing for your specific job in minutes.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Rome do you serve?\",\"a\":\"Regularly Fiera di Roma, the La Nuvola Convention Centre and Palazzo dei Congressi in EUR, plus hotels across Parioli, Trastevere and the historic centre. If your event is somewhere else in Rome, just send us the address.\"},{\"q\":\"Do you only cover Rome, or the rest of Italy too?\",\"a\":\"Rome is our home — we've printed here since 2008 and know the city's delivery routes inside out — but we ship across Italy to Milan, Florence, Bologna, Venice and beyond. Wherever your event is, send your files and we'll arrange delivery.\"}],\"Milan\":[{\"q\":\"Can you deliver printing to my hotel or stand in Milan?\",\"a\":\"Yes. We print and ship within 24h, then deliver 1–2 days later to MiCo – Milano Congressi, Fiera Milano in Rho, Allianz MiCo and any hotel in the city — straight to your stand, your room or the venue desk. It's printed and shipped within 24h and with you 1–2 days later.\"},{\"q\":\"How fast can I get printing done in Milan?\",\"a\":\"We print and ship within 24h, and your printing is delivered 1–2 days later across Milan — to your stand, hotel or the venue desk. Message us on WhatsApp and we'll confirm the exact timing for your fair in minutes.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within two hours — the fastest way is a quick WhatsApp message with your details.\"},{\"q\":\"I'm a foreign exhibitor and don't speak Italian — is that a problem?\",\"a\":\"Not at all. We're a Dutch-Italian company working in English, Dutch and Italian, and we've been printing in Rome since 2008. We also fix the file problems foreign exhibitors hit most — A4 vs US Letter, centimetres vs inches — before they cause a costly reprint.\"},{\"q\":\"Which venues in Milan do you serve?\",\"a\":\"MiCo – Milano Congressi, Fiera Milano (Rho), Allianz MiCo and city-centre hotels. If your event is anywhere else in Milan, just give us the address.\"},{\"q\":\"Are you based in Milan, or do you cover the rest of Italy?\",\"a\":\"We print and ship to Milan within 24h, but we're based in Rome, where we've printed since 2008. We also cover Florence, Bologna, Venice and the rest of Italy — send your files wherever your event is.\"}],\"Florence\":[{\"q\":\"Can you deliver printing to my hotel or stand in Florence?\",\"a\":\"Yes. We deliver city-wide in Florence — to Fortezza da Basso, the Palazzo dei Congressi and the city's Renaissance congress venues, as well as your hotel or stand. Tell us the address and we handle the rest.\"},{\"q\":\"How fast can I get printing done in Florence?\",\"a\":\"Send us your files and we print and ship within 24h, delivered 1–2 days later across Florence — to your hotel, stand or venue. Message us on WhatsApp to confirm the timing for your job.\"},{\"q\":\"What can you print for a trade fair or conference?\",\"a\":\"Everything a stand needs: business cards, brochures and depliants, roll-up banners, posters and large-format prints, flyers and invitations, and pre-spaced stickers — one print partner for the whole booth, all adapted to Italian print standards.\"},{\"q\":\"How much does printing cost and how do I get a price?\",\"a\":\"Prices depend on quantity, size and finish, and printing in Italy is usually a fraction of what last-minute printing costs back home. Tell us what you need and you'll have a quote within
